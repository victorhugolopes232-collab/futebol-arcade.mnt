    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;

  #title { font-weight: bold; font-size: 1.1rem; color: #64ffda; }

  .top-btn {
    background: #1d3557;
    color: #fff;
    border: 1px solid #457b9d;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1b4332;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #overlay-msg {
    position: absolute;
    top: 15px;
    background: rgba(0, 0, 0, 0.75);
    padding: 10px 18px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #64ffda;
    pointer-events: none;
  }
  #overlay-msg h3 { font-size: 1rem; color: #ffd166; margin-bottom: 4px; }
  #overlay-msg p { font-size: 0.85rem; color: #e0fbfc; }
  #power-bar-wrap {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    color: #ffd166;
  }
  #controls {
    width: 100%;
    max-width: 800px;
    background: #112240;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 2px solid #1e3a5f;
  }
  .btn-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  button.ctrl {
    flex: 1;
    min-width: 75px;
    padding: 12px 6px;
    font-size: 0.78rem;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    color: #fff;
    background: #2b4c7e;
    cursor: pointer;
    active: transform: scale(0.96);
  }
  button.ctrl:active { background: #64ffda; color: #0a192f; }
  button.gk { background: #e63946; }
  button.action { background: #2a9d8f; }

    text-align: center;
    font-size: 0.72rem;
    color: #8892b0;
  }
</style>
</head>

<div id="top-bar">
  <div id="title">⚽ Futebol Arcade</div>
  <div id="score">VOCÊ 0 x 0 BOT</div>
  <div>
    <button class="top-btn" onclick="togglePause()">Ⅱ ▶</button>
    <button class="top-btn" onclick="triggerReplay()">REPLAY DO GOL</button>
    <button class="top-btn" onclick="skipPhase()">PULAR ▶</button>
  </div>
</div>

<div id="game-container">

  <div id="power-bar-wrap">FORÇA: <span id="power-val">0</span>%</div>
</div>

<div id="controls">

    <button class="ctrl gk" onclick="gkDive('down')">⬇ CANTO DE BAIXO</button>
  </div>
  <div class="btn-row" id="atk-controls">
    <button class="ctrl action" onclick="doCross()">⤴ CRUZAMENTO ALTO</button>
    <button class="ctrl" onclick="requestPass()">PEDIR PASSE</button>
    <button class="ctrl action" onmousedown="startCharge()" onmouseup="releaseKick()" ontouchstart="startCharge()" ontouchend="releaseKick()">CHUTE</button>
    <button class="ctrl" onclick="botKick()">BOT CHUTA</button>
  </div>
  <div class="btn-row">
    <button class="ctrl" onclick="resetGame()">MENU</button>
    <button class="ctrl" onclick="doPass()">PASSE</button>
    <button class="ctrl action" onclick="quickKick()">CHUTE RÁPIDO</button>
    <button class="ctrl" onclick="toggleSprint()">CORRIDA</button>
  </div>
  <div id="hints">J: PASSE · K: CHUTE · L: BOT CHUTA · U: CRUZAMENTO</div>
</div>

const canvas = document.getElementById('pitch');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = canvas.parentElement.clientWidth;
  height = canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

let scorePlayer = 0;
let scoreBot = 0;
let paused = false;
let mode = 'gk'; // 'gk' ou 'atk'
let power = 0;
let charging = false;
let sprint = false;
let replayData = [];
let replaying = false;
let replayIndex = 0;

const ball = { x: 0, y: 0, vx: 0, vy: 0, z: 0, vz: 0, r: 8 };
const player = { x: 0, y: 0, r: 14, dive: null };
const bot = { x: 0, y: 0, r: 14, timer: 0 };
const teammate = { x: 0, y: 0, r: 14 };

function setupRound(newMode) {
  mode = newMode;
  ball.vx = 0; ball.vy = 0; ball.z = 0; ball.vz = 0;
  power = 0; charging = false;
  document.getElementById('power-val').innerText = '0';

  if (mode === 'gk') {
    document.getElementById('role-title').innerText = '🧤 VOCÊ É O GOLEIRO';
    document.getElementById('role-sub').innerText = 'Escolha o canto para pular';
    player.x = 55;
    player.y = height / 2;
    player.dive = null;
    bot.x = width * 0.65;
    bot.y = height / 2;
    bot.timer = 90;
    ball.x = bot.x - 18;
    ball.y = bot.y;
  } else {
    document.getElementById('role-title').innerText = '⚽ SUA VEZ DE ATACAR';
    document.getElementById('role-sub').innerText = 'Passe, cruze ou segure CHUTE';

    player.y = height * 0.65;
    teammate.x = width * 0.45;
    teammate.y = height * 0.3;
    bot.x = width - 55;
    bot.y = height / 2;
    ball.x = player.x + 18;
    ball.y = player.y;
  }
}

  if (mode !== 'gk' || paused) return;
  player.dive = dir;
  player.y = dir === 'up' ? height / 2 - 55 : height / 2 + 55;
}

  const speed = 9 + Math.random() * 3;
  ball.vx = Math.cos(angle) * speed;
  ball.vy = Math.sin(angle) * speed;
  bot.timer = -1;
}

function startCharge() {
  if (mode !== 'atk') return;
  charging = true;
}

function releaseKick() {
  if (!charging) return;
  charging = false;
  const speed = 6 + (power / 100) * 10;
  const targetY = height / 2 + (Math.random() * 80 - 40);
  const angle = Math.atan2(targetY - ball.y, (width - 40) - ball.x);
  ball.vx = Math.cos(angle) * speed;
  ball.vy = Math.sin(angle) * speed;
  power = 0;
  document.getElementById('power-val').innerText = '0';
}

function quickKick() {
  if (mode !== 'atk') return;
  power = 75;
  charging = true;
  releaseKick();
}

function doPass() {
  if (mode !== 'atk') return;
  const angle = Math.atan2(teammate.y - ball.y, teammate.x - ball.x);
  ball.vx = Math.cos(angle) * 8;
  ball.vy = Math.sin(angle) * 8;
}

function requestPass() {
  if (mode !== 'atk') return;
  const angle = Math.atan2(player.y - ball.y, player.x - ball.x);
  ball.vx = Math.cos(angle) * 8;
  ball.vy = Math.sin(angle) * 8;
}

function doCross() {
  if (mode !== 'atk') return;
  const angle = Math.atan2((height / 2 - 30) - ball.y, (width - 130) - ball.x);
  ball.vx = Math.cos(angle) * 7;
  ball.vy = Math.sin(angle) * 7;
  ball.vz = 6;

  sprint = !sprint;
  player.x += sprint ? 25 : -10;
}

function skipPhase() { setupRound(mode === 'gk' ? 'atk' : 'gk'); }
function resetGame() {
  scorePlayer = 0; scoreBot = 0;
  updateScore();
  setupRound('gk');

  if (replayData.length === 0) return;
  replaying = true;
  replayIndex = 0;

  document.getElementById('score').innerText = `VOCÊ ${scorePlayer} x ${scoreBot} BOT`;

  if (k === 'arrowdown') gkDive('down');
  if (k === 'j') doPass();
  if (k === 'k') quickKick();
  if (k === 'l') botKick();
  if (k === 'u') doCross();
});

    const frame = replayData[replayIndex];

      ball.x = frame.bx; ball.y = frame.by;

      replayIndex++;
    } else {
      replaying = false;
    }
    return;
  }

    power = Math.min(100, power + 2.5);
    document.getElementById('power-val').innerText = Math.floor(power);
  }

    bot.timer--;
    if (bot.timer === 0) botKick();
  }

  if (mode === 'atk') {
    bot.y += Math.sin(Date.now() / 250) * 2.2;
  }

  ball.vx *= 0.99;
  ball.vy *= 0.99;

    ball.vz -= 0.35;
    if (ball.z <= 0) { ball.z = 0; ball.vz = 0; }
  }
