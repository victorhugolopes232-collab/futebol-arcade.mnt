<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#14202b;color:white;font-family:Arial,sans-serif;overflow:hidden;position:fixed;width:100%;height:100%}
canvas{width:100vw;height:100dvh;display:block;touch-action:none;pointer-events:auto}

#panel label{display:block;line-height:1.5;}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,rgba(8,24,39,.58),rgba(16,43,64,.52));padding:4px 8px;border-radius:12px;font-weight:bold;z-index:2;font-size:11px;text-align:center;white-space:nowrap;border:1px solid #ffffff22;box-shadow:0 3px 10px #0005;min-width:min(62vw,230px);backdrop-filter:blur(4px)}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}.sb-team{min-width:0;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px}.sb-team .name{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}.sb-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}.sb-score{font-size:18px;letter-spacing:1px;line-height:1.1;color:#fff;text-shadow:0 2px 8px #000}.sb-clock{margin:2px auto 1px;display:inline-block;padding:1px 8px;border-radius:9px;background:#0006;color:#ffe17a;font-size:11px;letter-spacing:1px}.sb-info{display:flex;justify-content:center;gap:8px;font-size:8px;color:#c5d6e5;border-top:1px solid #ffffff20;padding-top:3px}.sb-card{color:#ffe17a;font-weight:900}
#menu{position:absolute;inset:0;pointer-events:auto;background:#07121de8;display:flex;align-items:center;justify-content:center;z-index:5}
.panel,.panel *{touch-action:pan-y !important}
.panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#203247;padding:22px;border-radius:18px;text-align:center;width:min(90%,380px);max-height:90dvh;overflow-y:auto}
button{touch-action:manipulation;pointer-events:auto;position:relative;z-index:6;border:0;border-radius:14px;padding:12px 16px;margin:4px;font-weight:bold;background:#43d17d;color:#10251a;font-size:15px;cursor:pointer}

#controls>*{pointer-events:auto}
#joy{width:108px;height:108px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff60;position:relative;flex-shrink:0}
#knob{position:absolute;width:44px;height:44px;left:30px;top:30px;border-radius:50%;background:#ffffffb8;pointer-events:none}

#buttons button:active{background:rgba(200,216,216,.72)}
#menuBtn{background:#3b5066;color:white;padding:8px 14px;font-size:13px;border-radius:10px}
#powerBarWrap{position:absolute;bottom:156px;left:50%;transform:translateX(-50%);width:min(70%,260px);display:none;z-index:4;pointer-events:none}
#powerBarBg{width:100%;height:18px;background:#0a1a28;border:2px solid #ffffffaa;border-radius:10px;overflow:hidden;position:relative}
#powerBarFill{height:100%;width:0%;background:linear-gradient(90deg,#4ef4ff,#ffe447,#ff6b3d);border-radius:8px;transition:none}
#powerBarLabel{text-align:center;font-size:13px;font-weight:bold;margin-top:4px;text-shadow:0 1px 3px #000}
@media (hover:hover) and (pointer:fine){#pcHint{display:block!important}}
#gkPick{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(2,8,16,.72);text-align:center;pointer-events:auto}
#gkPick .gkT{font-size:22px;font-weight:900;letter-spacing:1px}
#gkPick .gkS{font-size:13px;color:#9fb4c8;margin-top:-6px}
#gkPick .gkB{display:flex;flex-direction:column;gap:14px}
#gkPick button{width:min(70vw,260px);padding:16px 10px;font-size:18px;border-radius:20px;margin:0;background:linear-gradient(180deg,#ffd978,#f0a92b);color:#2d1d00;box-shadow:0 6px 0 #9a6a10}
#gkPick button:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6a10}
#gkPick button i{display:block;font-style:normal;font-size:44px;line-height:1}
#gkPick button span{display:block;font-size:12px;letter-spacing:1px;margin-top:2px}

.bracket-wrap{display:flex;gap:26px;overflow-x:auto;align-items:stretch;padding:14px 8px 24px;max-width:95vw;margin:auto}.bracket-round{display:flex;flex-direction:column;justify-content:space-around;min-width:210px;gap:20px}.bracket-round h3{color:#ffd66b;margin:4px}.bracket-match{background:#132638;border:1px solid #56748c;border-radius:12px;padding:10px;text-align:left;box-shadow:0 3px 8px #0005;position:relative}.bracket-match div{padding:5px 2px;border-bottom:1px solid #ffffff20}.bracket-match div:last-child{border:0}.bracket-match .win{color:#7ee2a8;font-weight:bold}.bracket-match .score{float:right;color:#ffdc76}.bracket-round:not(:last-child) .bracket-match:after{content:'';position:absolute;right:-27px;top:50%;width:26px;border-top:2px solid #8ca9bd}.bracket-round:not(:first-child) .bracket-match:before{content:'';position:absolute;left:-14px;top:50%;height:2px;width:14px;background:#8ca9bd}

#menu{background:radial-gradient(ellipse at 50% -10%,#1f6b4a 0%,#0e2b3a 50%,#050d15 100%)!important}
#menu::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 44px,transparent 44px 88px)}
.panel{background:linear-gradient(160deg,rgba(34,54,76,.94),rgba(16,29,44,.96))!important;border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);border-radius:26px!important;padding:22px 18px!important;position:relative}
.logo{font-size:56px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.title{font-size:27px;font-weight:900;letter-spacing:2px;margin:6px 0 2px;background:linear-gradient(90deg,#fff,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:#9fb4c8;letter-spacing:1px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:bold;letter-spacing:1.5px;color:#8fa6bb;text-align:left;margin:14px 4px 6px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.32);border-radius:16px;padding:4px}
.seg button{flex:1;margin:0;padding:11px 2px;background:transparent;color:#b8c7d6;font-size:13px;border-radius:12px;box-shadow:none}
.seg button.on[data-d="facil"]{background:linear-gradient(180deg,#6af0a2,#2fc16b);color:#0c2a1a}
.seg button.on[data-d="medio"]{background:linear-gradient(180deg,#ffd978,#f0a92b);color:#2d1d00}
.seg button.on[data-d="dificil"]{background:linear-gradient(180deg,#ff8a7a,#e5483a);color:#fff}
.btn-main{width:100%;margin:14px 0 10px;padding:17px;font-size:20px;letter-spacing:1px;border-radius:18px;background:linear-gradient(180deg,#5bf09a,#2fc16b)!important;color:#0c2a1a!important;box-shadow:0 6px 0 #1b8a4a,0 12px 22px rgba(0,0,0,.4)}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 #1b8a4a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-sec{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;font-size:13px;border-radius:16px;background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid rgba(255,255,255,.13);box-shadow:none}
.btn-sec .ic{font-size:22px}.btn-sec b{font-size:12px;color:#7dffb0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:8px 12px;background:rgba(0,0,0,.25);border-radius:14px;font-size:14px;color:#dbe6f0}
.row select{padding:6px 10px;border-radius:10px;border:0;background:#2d4560;color:#fff;font-size:15px;font-weight:bold}
button:active{filter:brightness(.92)}
#buttons button,#pause,#menuBtn{box-shadow:none}


.panel .bracket-wrap,.panel .bracket-wrap *{touch-action:pan-x pan-y !important}
.bracket-wrap{max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.panel:has(.bracket-wrap){width:min(96vw,900px)}
@media (max-width:600px){.bracket-round{min-width:165px}}
#buttons button.big{font-size:14px}
#buttons button.sm{height:40px;border-radius:14px;font-size:10px;line-height:1.05}
#buttons button#menuBtn{background:#3b5066;color:#fff}
#controls,#pause{transition:opacity .45s ease}
body.celeb #controls,body.celeb #pause{opacity:0;pointer-events:none}
#buttons #crossBtn{grid-column:1/-1;width:100%;background:rgba(124,58,237,.92);color:#fff;font-size:12px}
#buttons #crossBtn.pulse{animation:crossPulse .7s infinite alternate;outline:3px solid #ffd66b}
@keyframes crossPulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
#buttons #requestPassBtn{background:rgba(47,123,255,.9);color:#fff}
#buttons #requestPassBtn:active{background:#1f5fd6}
#buttons #requestShotBtn{background:rgba(229,57,53,.92);color:#fff}
#buttons #requestShotBtn:active{background:#b71c1c}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" style="display:none"></div>
<button id="pause" onclick="pause()">Ⅱ</button>
<button id="replayBtn" onclick="playGoalReplay()" style="display:none;position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:4;background:#ffd66b;color:#241800">▶ REPLAY DO GOL</button>

<button id="introSkip" onclick="endIntro()" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(8,20,32,.85);color:#fff;border:1px solid #ffffff55;padding:10px 22px">PULAR ▶</button>

<div id="gkPick">
  <div class="gkT">🧤 VOCÊ É O GOLEIRO</div>
  <div class="gkS">Escolha o canto para pular</div>
  <div class="gkB">
    <button onclick="pickKeeper(0)"><i>⬆</i><span>CANTO DE CIMA</span></button>
    <button onclick="pickKeeper(2)"><i>⬇</i><span>CANTO DE BAIXO</span></button>
  </div>
</div>

<div id="powerBarWrap">
  <div id="powerBarBg"><div id="powerBarFill"></div></div>
  <div id="powerBarLabel">FORÇA 0%</div>
</div>

<div id="controls">
  <div id="joy"><div id="knob"></div></div>
  <div id="actions">
    <div id="buttons">
      <button id="crossBtn" class="sm" style="display:none" onclick="requestCross()">⤴ CRUZAMENTO ALTO</button>
      <button id="requestPassBtn" class="sm" onclick="requestPass()">PEDIR PASSE</button>
      <button id="requestShotBtn" class="sm" onclick="requestShot()">CHUTE BOT</button>
      <button id="menuBtn" class="sm" onclick="menu()">MENU</button>
      <button id="passBtn" class="big">PASSE</button>
      <button id="shotBtn" class="big">CHUTE</button>
      <button id="runBtn" class="big">CORRIDA</button>
    </div>
    <div id="pcHint" style="display:none;color:#fff;font-size:12px;text-shadow:0 1px 3px #000;margin-top:4px">J: PASSE · K: CHUTE · L: BOT CHUTA · U: CRUZAMENTO</div>
  </div>
</div>

<div id="menu">
  <div class="panel" id="panel"></div>
</div>
<div id="halfBox" style="position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(2,8,16,.78)"></div>

<script>
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
let cw = 0, ch = 0, F = {x:10, y:45, w:300, h:400};
const DIFFS = {
  facil:  {speed:0.85,react:1.5,guess:0.22,aiMiss:0.32,gk:0.8,shotProb:0.35,zone:0.26,spread:1.6},
  medio:  {speed:1,   react:1,  guess:0.38,aiMiss:0.2, gk:1,  shotProb:0.45,zone:0.30,spread:1.25},
  dificil:{speed:1.15,react:0.7,guess:0.55,aiMiss:0.1, gk:1.2,shotProb:0.78,zone:0.40,spread:1.05}
};
let difficulty = 'medio';
function DIFF(){return DIFFS[difficulty]||DIFFS.medio;}
function DD(team){return team===1?DIFF():DIFFS.medio;}
function coolMul(h){return h.team===1?DIFF().react:1;}
function setDifficulty(d){difficulty=d;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));}
let fieldScale = 1.6, camX = 0, camY = 0, camReady = false; // campo maior que a tela + câmera que segue a bola
let teamA = [], teamB = [], all = [], ball = null;
let score = [0, 0], secs = 0, active = false, halt = false;
let matchDuration=90, matchClockSpeed=1.0, stoppagePerHalf=5, matchPlayers=11, teamBlueName='AZUL', teamOrangeName='LARANJA', blueColor='#4bbdff', orangeColor='#ff9c42', ballColor='#ffffff';
let requestPassUntil=0;
let stopAnn=[false,false], stoppageHalf=[0,0], stoppageBanner=null;
let stoppageHoldT=0;
// Acréscimo esgotado: só apita quando a bola sai da zona de ataque (perto do gol). Trava de segurança de 30s.
function stoppageHolding(){
  if(training||penaltyMode||!ball||stoppageHoldT>30)return false;
  if(foulRestart||lob)return true;
  const cy=F.y+F.h/2;
  const near=ball.x<F.x+F.w*0.28||ball.x>F.x+F.w*0.72;
  return near&&Math.abs(ball.y-cy)<F.h*0.34;
}
function announceStoppage(h){stopAnn[h]=true;stoppageHalf[h]=1+Math.floor(Math.random()*5);stoppageBanner={text:'+'+stoppageHalf[h]+' MIN DE ACRÉSCIMO',sub:h===0?'1º TEMPO':'2º TEMPO',until:performance.now()+2000};}
function showGkPick(show){const e=document.getElementById('gkPick');if(e)e.style.display=show?'flex':'none';}
function pickKeeper(lane){
  if(!pen||pen.phase!=='pick')return;
  pen.userLane=lane; showGkPick(false);
  const cy=F.y+F.h/2, gh=F.h*0.10, d=DIFF();
  const rng=({facil:[.35,.8],medio:[.45,.9],dificil:[.55,.97]})[difficulty]||[.45,.9];
  if(Math.random()<d.aiMiss) pen.aiAimY=cy+(Math.random()<0.5?-1:1)*gh*(1.2+Math.random()*0.5);
  else{const side=Math.random()<0.5?-1:1;const m=rng[0]+Math.random()*(rng[1]-rng[0]);pen.aiAimY=cy+side*gh*m;}
  pen.phase='ai'; pen.shotTimer=0.8;
}
function simName(label,num){const pool=NAMES_A.concat(NAMES_B);let h=0;const t=label+'#'+num;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return pool[h%pool.length];}
function cupBump(label,num,type,name){const k=label+'#'+num;const s=cup.stats[k]||(cup.stats[k]={team:label,num:num,goals:0,assists:0});if(!s.name)s.name=name||simName(label,num);s[type]++;}
function cupAddStat(team,num,type,name){if(!cup)return;if(!cup.stats)cup.stats={};cupBump(team===0?cupDisplayName('TIME AZUL'):cupOpponent,num,type,name);}
function cupSimStats(label,n){if(!cup)return;if(!cup.stats)cup.stats={};for(let i=0;i<n;i++){const sc=Math.random()<0.65?7+Math.floor(Math.random()*5):2+Math.floor(Math.random()*10);cupBump(label,sc,'goals');if(Math.random()<0.7){let as=2+Math.floor(Math.random()*10);if(as===sc)as=as===11?2:as+1;cupBump(label,as,'assists');}}}
function cupStatsHTML(st){
  const arr=Object.values(st||(cup&&cup.stats)||{});
  const box=(title,key)=>{const other=key==='goals'?'assists':'goals';const l=arr.filter(s=>s[key]>0).sort((a,b)=>b[key]-a[key]||b[other]-a[other]).slice(0,5);
    return '<div style="text-align:left;margin:8px 0;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px"><b style="color:#ffd66b">'+title+'</b>'+(l.length?l.map((s,i)=>'<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:14px"><span>'+(i+1)+'. '+cupEscape(s.name||simName(s.team,s.num))+' · Nº '+s.num+' <small style="color:#9fb4c8">('+cupEscape(s.team)+')</small></span><b>'+s[key]+'</b></div>').join(''):'<div style="font-size:13px;color:#9fb4c8;padding:3px 0">Ainda sem registros</div>')+'</div>';};
  return '<div style="max-width:340px;margin:6px auto">'+box('👟 ARTILHEIROS','goals')+box('🎯 ASSISTÊNCIAS','assists')+'</div>';
}
let sel = 0, joy = {x:0, y:0}, sprinting = false;
let mouseAim = {x:0,y:0}, mouseAimActive=false, mouseAction=null;
let last = performance.now();
let matchOver = false;
let training = false;
let challengeMode=null;
let kickLock = 0;
let kickoffLock = false;
let lob = null; // cruzamento alto em andamento
let goalFreeze = 0, goalCelebT = 0, celebP = null, celebTarget = null, celebMates = []; // comemoração: autor corre p/ a lateral por 3s
let kickoffTeam = 0, kickoffHold = 0;
let penaltyMode = false;
let pen = null;
let penaltyFirstTeam = 0; // alterna quem inicia cada disputa
let intro=null;
let cup=null, cupRound=0, cupOpponent="", cupActiveMatch=false, cupTitle="COPA / MATA-MATA", cupSavedTeamNames=null;
let myJerseyNumber=10, sidesSwapped=false, halftimeDone=false, halftimePause=0, goalBanner=null, lastTouchPlayer=null, previousTouchPlayer=null;
let replayFrames=[], replayPlayback=null, replaySaved=null, replayRecordTick=0, replayButtonTimer=0;

let charging = null;
let chargePower = 0;
let chargeStart = 0;
const CHARGE_TIME = 0.48;

const powerBarWrap = document.getElementById('powerBarWrap');
const powerBarFill = document.getElementById('powerBarFill');
const powerBarLabel = document.getElementById('powerBarLabel');

function size() {
  cw = innerWidth;
  ch = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(cw * dpr);
  cv.height = Math.floor(ch * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bottomSpace = 136;
  const topSpace = 36;
  const viewW = cw - 16, viewH = Math.max(200, ch - topSpace - bottomSpace);
  F = {
    x: 8,
    y: topSpace,
    w: viewW * fieldScale,
    h: viewH * fieldScale
  };
  camReady = false;

  if (all.length) {
    for (const p of all) {
      p.x = F.x + p.homeX * F.w;
      p.y = F.y + p.homeY * F.h;
    }
    if (ball) {
      if (!active) {
        ball.x = F.x + F.w / 2;
        ball.y = F.y + F.h / 2;
      } else {
        ball.x = clamp(ball.x, F.x + 4, F.x + F.w - 4);
        ball.y = clamp(ball.y, F.y + 4, F.y + F.h - 4);
      }
    }
  }
}

addEventListener('resize', size);
size();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const norm = (x, y) => {
  const m = Math.hypot(x, y) || 1;
  return {x: x / m, y: y / m};
};


// Sistema de faltas e cobranças livres
let foulRestart=null, foulCooldown=0, foulBanner=null;
function showFoulNotice(msg){
 let el=document.getElementById('foulNotice');if(!el){el=document.createElement('div');el.id='foulNotice';el.style.cssText='position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:99;background:#101827ee;color:white;border:2px solid #facc15;border-radius:12px;padding:12px 18px;font:bold 15px Arial;text-align:center;box-shadow:0 6px 20px #0008';document.body.appendChild(el);}
 el.textContent=msg;el.style.display='block';clearTimeout(window._foulNoticeTimer);window._foulNoticeTimer=setTimeout(()=>el.style.display='none',2500);
}
function removeSentOff(p){for(const arr of [all,teamA,teamB]){const i=arr.indexOf(p);if(i>=0)arr.splice(i,1);}}
function markFoul(carrier, opponents){
 if(foulRestart||foulCooldown>0||!carrier||!ball)return;
 const offender=opponents.slice().sort((a,b)=>dist(a,carrier)-dist(b,carrier))[0];
 const idx=offender.team===0?0:1; offender.foulCount=(offender.foulCount||0)+1;
 let discipline='';
 // Só uma parte das faltas gera cartão; o jogador controlado por você nunca é expulso.
 const carded=offender!==userPlayer()&&Math.random()<0.18;
 if(carded){
  if(!offender.yellowCards){matchCards[idx]++;offender.yellowCards=1;discipline='🟨 Cartão amarelo';}
  else{matchCards[idx]++;matchCards[2+idx]++;offender.redCard=true;offender.sentOff=true;removeSentOff(offender);discipline='🟥 Segundo amarelo — expulso';}
 }
 // Falta dentro da área adversária vira pênalti; fora dela, cobrança livre.
 const attackRight=((carrier.team===0)!==sidesSwapped);
 const inBox=(attackRight ? ball.x>F.x+F.w*.82 : ball.x<F.x+F.w*.18) && Math.abs(ball.y-(F.y+F.h/2))<F.h*.25;
 let fx=ball.x,fy=ball.y;
 if(inBox){fx=attackRight?F.x+F.w*.88:F.x+F.w*.12;fy=F.y+F.h/2;}

function drawCrowd(){
  const t=performance.now()/1000;
  const exc=(goalFreeze>0||(goalBanner&&goalBanner.time>0))?1:0;
  const pal=[blueColor,orangeColor,'#ffffff','#ffd84d','#e0525c','#7dffb0','#c9b6ff','#ff7ad9'];
  const step=9;
  const stands=[{y:F.y-34,rows:3,side:0},{y:F.y+F.h+3,rows:7,side:1}];
  const i0=Math.max(0,Math.floor((camX-F.x-12)/step)), i1=Math.min(Math.ceil(F.w/step),Math.ceil((camX+(intro?F.w+F.x+60:cw)-F.x+12)/step));
  for(const s of stands){
    const h=s.rows*10+4;
    const gr=g.createLinearGradient(0,s.y,0,s.y+h);
    gr.addColorStop(0,s.side?'#26394a':'#15212c');gr.addColorStop(1,s.side?'#15212c':'#26394a');
    g.fillStyle=gr;g.fillRect(F.x-8,s.y,F.w+16,h);
    for(let r=0;r<s.rows;r++){
      const ry=s.y+8+r*10;
      for(let i=i0;i<=i1;i++){
        const hh=((i*73856093)^(r*19349663)^((s.side+1)*83492791))>>>0;
        const ph=(hh%628)/100, sp=2+(hh%3);
        const bob=-Math.abs(Math.sin(t*sp+ph))*(exc?5:1.4);
        const x=F.x+i*step+(r%2)*4.5, y=ry+bob;
        g.fillStyle=pal[(hh>>>3)%pal.length];
        g.beginPath();g.arc(x,y+2,3.4,0,Math.PI*2);g.fill();
        g.fillStyle='#f1c9a0';
        g.beginPath();g.arc(x,y-2.2,2,0,Math.PI*2);g.fill();
      }
    }
  }
}

function leagueSchedule(keys,legs){
  const t=keys.slice();
  for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]];}
  const n=t.length, first=[];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){let a=t[i],b=t[n-1-i];if((r+i)%2===1){const x=a;a=b;b=x;}rd.push({a:a,b:b,sa:null,sb:null});}
    first.push(rd);
    t.splice(1,0,t.pop());
  }
  if(legs===2){return first.concat(first.map(rd=>rd.map(m=>({a:m.b,b:m.a,sa:null,sb:null}))));}
  return first;
}
function leagueBump(label,num,type,name){if(!league)return;if(!league.stats)league.stats={};const k=label+'#'+num;const s=league.stats[k]||(league.stats[k]={team:label,num:num,goals:0,assists:0});if(!s.name)s.name=name||simName(label,num);s[type]++;}

function leagueSimStats(label,n){for(let i=0;i<n;i++){const sc=Math.random()<0.65?7+Math.floor(Math.random()*5):2+Math.floor(Math.random()*10);leagueBump(label,sc,'goals');if(Math.random()<0.7){let as=2+Math.floor(Math.random()*10);if(as===sc)as=as===11?2:as+1;leagueBump(label,as,'assists');}}}
function leagueSimRest(){
  if(!league)return;
  while(league.round<league.rounds.length){
    const rd=league.rounds[league.round];
    rd.forEach(m=>{if(m.sa!=null)return;m.sa=Math.floor(Math.random()*3.6);m.sb=Math.floor(Math.random()*3.6);leagueSimStats(leagueLabel(m.a),m.sa);leagueSimStats(leagueLabel(m.b),m.sb);});
    league.last={n:league.round+1,matches:rd.slice()};
    league.round++;league.mi=0;
  }
  league.done=true;
  showLeague();
}
function leagueSimStepStart(){

function leagueSimOne(){

  const rd=league.rounds[league.round],m=rd[league.mi||0];

  league.last={n:league.round+1,matches:rd.filter(x=>x.sa!=null)};
  league.mi=(league.mi||0)+1;
  if(league.mi>=rd.length){league.mi=0;league.round++;if(league.round>=league.rounds.length)league.done=true;}

}

function leagueTable(){
  const st={};
  league.keys.forEach(k=>{st[k]={k:k,p:0,j:0,v:0,e:0,d:0,gp:0,gc:0};});
  league.rounds.forEach(rd=>rd.forEach(m=>{
    if(m.sa==null)return;
    const A=st[m.a],B=st[m.b];
    A.j++;B.j++;A.gp+=m.sa;A.gc+=m.sb;B.gp+=m.sb;B.gc+=m.sa;
    if(m.sa>m.sb){A.v++;A.p+=3;B.d++;}else if(m.sa<m.sb){B.v++;B.p+=3;A.d++;}else{A.e++;B.e++;A.p++;B.p++;}
  }));
  return Object.values(st).sort((x,y)=>y.p-x.p||(y.gp-y.gc)-(x.gp-x.gc)||y.gp-x.gp||leagueLabel(x.k).localeCompare(leagueLabel(y.k)));
}

function finishLeagueMatch(){
  const rd=league.rounds[league.round];
  rd.forEach(m=>{
    if(m.a==='TIME AZUL'||m.b==='TIME AZUL'){const meA=m.a==='TIME AZUL';m.sa=meA?score[0]:score[1];m.sb=meA?score[1]:score[0];}
    else{m.sa=Math.floor(Math.random()*3.6);m.sb=Math.floor(Math.random()*3.6);leagueSimStats(leagueLabel(m.a),m.sa);leagueSimStats(leagueLabel(m.b),m.sb);}
  });
  league.last={n:league.round+1,matches:rd.slice()};
  league.round++;
  if(league.round>=league.rounds.length)league.done=true;
  showLeague();

function setup(withKickoff) {

    form.forEach((v, i) => {

  };

function start(isTraining) {

function preparePenalty(){

  const list=team===0?teamA:teamB;
  const shooters=list.filter(p=>p.role!=='GK');
  const shooter=shooters[pen.attempts[team]%shooters.length];
  pen.shooter=shooter; pen.phase=(team===1)?'pick':'ready'; pen.shotTimer=0.65+Math.random()*0.45; pen.userLane=null;
  for(const p of all){ p.x=F.x+p.homeX*F.w; p.y=F.y+p.homeY*F.h; }

  if(shooter){shooter.x=spotX-26; shooter.y=cy;}
  ball.x=spotX; ball.y=cy; ball.vx=ball.vy=0;
  // Apenas o goleiro da equipe que está defendendo fica dentro do gol.
  const defendingTeam=team===0?teamB:teamA;
  const waitingKeeper=(team===0?teamA:teamB)[0];
  pen.keeper=defendingTeam[0];
  const goalX=F.x+F.w-7;
  if(pen.keeper){pen.keeper.x=goalX;pen.keeper.y=cy;pen.keeper.homeX=0.99;pen.keeper.homeY=0.5;}
  // O goleiro que não defende fica próximo, mas fora da boca do gol, aguardando.
  if(waitingKeeper){waitingKeeper.x=goalX-F.w*0.07;waitingKeeper.y=cy+(team===0?-F.h*0.19:F.h*0.19);}
  // Filas organizadas nas laterais opostas: azul acima e laranja abaixo.
  for(let t=0;t<2;t++){
    const arr=(t===0?teamA:teamB).filter(p=>p.role!=='GK');
    const sideY=t===0?F.y+F.h*0.07:F.y+F.h*0.93;
    arr.forEach((q,i)=>{
      if(q===shooter)return;
      q.x=F.x+F.w*(0.14+i*0.105);

  }

    pen.phase='ai';pen.shotTimer=0.65+Math.random()*0.45;
    // IA escolhe o canto; às vezes mira para fora (erro visível, bola passa ao lado da trave).
    const goalHalf=F.h*0.10;
    if(Math.random()<DIFF().aiMiss) pen.aiAimY=cy+(Math.random()<0.5?-1:1)*goalHalf*(1.2+Math.random()*0.5);

// Cobrança de pênalti 100% física: o resultado vem de onde a bola realmente cruza a linha do gol

function fieldPlayers(team) {
  return team.filter(p => p.role !== 'GK');
}



function selected() {
  if(foulRestart&&foulRestart.team===0&&foulRestart.player)return foulRestart.player;
  if (penaltyMode && pen) { if(pen.currentTeam!==0 || pen.phase==='ai' || pen.phase==='shot') return null; if(pen.shooter) return pen.shooter; }
  if(selectedPosition==='Goleiro') return teamA.find(p=>p.role==='GK')||null;
  const list = fieldPlayers(teamA);
  if (list.length === 0) return null;
  const candidates=list.filter(p=>selectedPosition==='Atacante'?p.role==='F':selectedPosition==='Meia'?p.role==='M':selectedPosition==='Volante'?p.role==='M'&&p.homeX<.55:selectedPosition==='Zagueiro'?p.role==='D':selectedPosition==='Lateral'?p.role==='D'&&(p.homeY<.3||p.homeY>.7):true);
  const pool=candidates.length?candidates:list;
  if(sel>=pool.length)sel=0;

}

function startCharge(type) {
  if (lob) { const sp = selected(); if (sp && dist(sp, ball) < 64 && ball.z < 64) headerBy(sp); return; } // cabeceio por comando
  if (foulRestart) return; // faltas são cobradas automaticamente
  if (!active || halt || (matchOver && !penaltyMode) || charging || goalFreeze > 0) return;
  if (!ball) return;

  let p = selected();
  if (!p) return;

  // Só inicia passe/chute com a bola praticamente no pé (sem puxar de longe).
  const touchMax = p.r + ball.r + 6;
  if (penaltyMode ? (pen.shooter!==p || dist(p,ball)>100) : (!p || dist(p, ball) > touchMax)) return;

  charging = type;
  chargePower = 0;
  chargeStart = performance.now();
  powerBarWrap.style.display = 'block';
  powerBarFill.style.width = '0%';
  powerBarLabel.textContent = type === 'shot' ? 'CHUTE 0%' : 'PASSE 0%';
  powerBarFill.style.background = type === 'shot'
    ? 'linear-gradient(90deg,#ffe447,#ff9c42,#ff3d3d)'
    : 'linear-gradient(90deg,#4ef4ff,#4bbdff,#3b7fff)';

  // Não teleporta a bola: só trava a velocidade se ela já está no alcance do pé.
  ball.vx = 0;
  ball.vy = 0;

function updateCharge() {
  if (!charging) return;
  const elapsed = (performance.now() - chargeStart) / 1000;
  chargePower = clamp(elapsed / CHARGE_TIME, 0, 1);
  const pct = Math.round(chargePower * 100);
  powerBarFill.style.width = pct + '%';
  powerBarLabel.textContent = (charging === 'shot' ? 'CHUTE ' : 'PASSE ') + pct + '%';

  // Enquanto carrega, bola gruda no jogador (só se ainda estiver no alcance)
  const p = selected();
  if (p && ball) {
    if (!penaltyMode && dist(p, ball) > p.r + ball.r + 10) { cancelCharge(); return; }
    const n = (penaltyMode && pen) ? getAimDir(p) : mouseAimActive ? norm(mouseAim.x-p.x,mouseAim.y-p.y) :
      norm(Math.abs(joy.x)>0.1?joy.x:(((p.team===0)!==sidesSwapped)?0.3:-0.3),Math.abs(joy.y)>0.1?joy.y:0);
    ball.x = p.x + n.x * (p.r + ball.r + 1);
    ball.y = p.y + n.y * (p.r + ball.r + 1);
    ball.vx = 0;
    ball.vy = 0;
  }
}

function cancelCharge() {
  charging = null;
  chargePower = 0;
  if (powerBarWrap) {
    powerBarWrap.style.display = 'none';
    powerBarFill.style.width = '0%';
  }
}

function getAimDir(p) {
  // Pênalti: o gol é sempre o da direita; só a altura (canto) é escolhida por joystick/mouse.
  if (penaltyMode && pen) {
    const gx = F.x + F.w, cyP = F.y + F.h / 2, ghP = F.h * 0.10;
    let ay = cyP;
    if (mouseAimActive) ay = clamp(mouseAim.y, cyP - ghP * 1.25, cyP + ghP * 1.25);
    else if (Math.abs(joy.y) > 0.1) ay = cyP + joy.y * ghP * 0.9;
    return norm(gx - p.x, ay - p.y);
  }
  // No PC, a mira acompanha o cursor enquanto ele está no campo.
  if (mouseAimActive && (Math.abs(mouseAim.x-p.x)>2 || Math.abs(mouseAim.y-p.y)>2)) return norm(mouseAim.x-p.x, mouseAim.y-p.y);
  // Direção da mira: joystick > direção do gol
  if (Math.abs(joy.x) > 0.1 || Math.abs(joy.y) > 0.1) {
    return norm(joy.x, joy.y);
  }
  const goalX = ((p.team === 0) !== sidesSwapped) ? F.x + F.w - 18 : F.x + 18;
  const goalY = F.y + F.h / 2;
  return norm(goalX - p.x, goalY - p.y);
}

function releaseCharge() {
  if (!charging) return;
  const type = charging;
  const power = Math.max(chargePower, 0.25);
  cancelCharge();
  if (!ball) return;

  let p = selected();
  if (!p) return;

  // Só conclui se a bola ainda estiver no pé.
  if (!p || dist(p, ball) > p.r + ball.r + 8) return;

  const v = getAimDir(p);
  if(penaltyMode && pen && type==='shot' && pen.currentTeam===0){
    const power=Math.max(chargePower,0.25);
    let vv=v;
    if(power>0.92){const a=(Math.random()-0.5)*0.1,c=Math.cos(a),n=Math.sin(a);vv={x:v.x*c-v.y*n,y:v.x*n+v.y*c};} // força máxima = menos precisão

  }

    shots[p.team]++;
    // Curva mais suave: 30% fica moderado, 100% é forte
    // power 0.25..1.0 -> usa ease (power^1.35)
    const pCurve = Math.pow(power, 1.35);
    const speed = 2.8 + 9.5 * pCurve; // ~3.5 em 30%, ~12.3 em 100%
    ball.vx = v.x * speed;
    ball.vy = v.y * speed;
  } else {
    const pCurve = Math.pow(power, 1.2);
    const speed = 2.6 + 6.2 * pCurve;
    // Passe manual segue diretamente a direção escolhida pelo cursor/joystick.
    ball.vx = v.x * speed;
    ball.vy = v.y * speed;
  }

  // Empurra bem longe do pé para o drible não "comer" o chute
  ball.x = p.x + v.x * (p.r + ball.r + 14);
  ball.y = p.y + v.y * (p.r + ball.r + 14);
  p.cool = 0.7;
  touch(p);
  kickLock = 0.45; // impede pegar a bola de novo logo após o chute/passe

function nearestToBall(arr) {
  const list = arr.filter(p => p.role !== 'GK');
  if (!list.length) return null;
  return list.reduce((best, p) => dist(p, ball) < dist(best, ball) ? p : best, list[0]);
}

function closestToBall(arr, n) {
  const list = arr.filter(p => p.role !== 'GK').slice();
  list.sort((a, b) => dist(a, ball) - dist(b, ball));
  return list.slice(0, n);
}

function whoHasBall() {
  for (const p of all) {
    if (p.role === 'GK') continue;
    if (dist(p, ball) < p.r + ball.r + 8) return p.team;
  }
  if (Math.hypot(ball.vx, ball.vy) < 1.5) {
    let closest = null, bestD = 999;
    for (const p of all) {
      if (p.role === 'GK') continue;
      const dd = dist(p, ball);
      if (dd < bestD) { bestD = dd; closest = p; }
    }
    if (closest && bestD < 22) return closest.team;
  }
  return -1;
}

function separatePlayers() {
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      const d = dist(a, b);
      const minD = a.r + b.r + 2;
      if (d < minD && d > 0.1) {
        const push = (minD - d) * 0.4;
        const v = norm(a.x - b.x, a.y - b.y);
        a.x += v.x * push;
        a.y += v.y * push;
        b.x -= v.x * push;
        b.y -= v.y * push;
      }
    }
  }
}

// Estratégia da IA conforme placar e tempo: att = urgência de ataque (perdendo), def = proteger vantagem (ganhando).
// O efeito cresce com o passar do jogo e com o tamanho da diferença no placar.
function aiStrategy(team){
  if(training||penaltyMode||!score)return {att:0,def:0};
  const diff=score[team]-score[1-team];
  const tp=clamp(secs/matchDuration,0,1);
  const w=0.3+0.7*tp;
  if(diff<0)return {att:Math.min(1,0.6+0.2*(-diff-1))*w,def:0};
  if(diff>0)return {att:0,def:Math.min(1,0.6+0.2*(diff-1))*w};
  return {att:tp>0.8?0.25*(tp-0.8)/0.2:0,def:0};

  if(possession>=0) previousPossessionAI=possession;

    // Jogador controlado pelo usuário não é movido pela IA
    if (p === selected()) continue;
