<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Futebol Arcade</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#14202b;color:white;font-family:Arial,sans-serif;overflow:hidden;position:fixed;width:100%;height:100%}
#cv{width:100vw;height:100dvh;display:block;touch-action:none;pointer-events:auto}
canvas.kitPrev{display:block;margin:0 auto 2px;border-radius:50%;background:#1a2e1f}
#panel input[type="text"],#panel input:not([type]),#panel select{touch-action:auto;user-select:text;-webkit-user-select:text;pointer-events:auto;position:relative;z-index:10;font-size:16px;padding:8px;max-width:100%;}
#panel label{display:block;line-height:1.5;}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,rgba(8,24,39,.58),rgba(16,43,64,.52));padding:4px 8px;border-radius:12px;font-weight:bold;z-index:2;font-size:11px;text-align:center;white-space:nowrap;border:1px solid #ffffff22;box-shadow:0 3px 10px #0005;min-width:min(62vw,230px)}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}.sb-team{min-width:0;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px}.sb-team .name{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}.sb-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}.sb-score{font-size:18px;letter-spacing:1px;line-height:1.1;color:#fff;text-shadow:0 2px 8px #000}.sb-clock{margin:2px auto 1px;display:inline-block;padding:1px 8px;border-radius:9px;background:#0006;color:#ffe17a;font-size:11px;letter-spacing:1px}.sb-info{display:flex;justify-content:center;gap:8px;font-size:8px;color:#c5d6e5;border-top:1px solid #ffffff20;padding-top:3px}.sb-card{color:#ffe17a;font-weight:900}
#menu{position:absolute;inset:0;pointer-events:auto;background:#07121de8;display:flex;align-items:center;justify-content:center;z-index:5}
.panel,.panel *{touch-action:pan-y !important}
.panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#203247;padding:22px;border-radius:18px;text-align:center;width:min(90%,380px);max-height:90dvh;overflow-y:auto}
button{touch-action:manipulation;pointer-events:auto;position:relative;z-index:6;border:0;border-radius:14px;padding:12px 16px;margin:4px;font-weight:bold;background:#43d17d;color:#10251a;font-size:15px;cursor:pointer}
#pause{position:absolute;top:6px;right:8px;display:none;background:#33495d;color:white;padding:8px 12px;z-index:3}
#controls{position:absolute;bottom:4px;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:4px 8px;z-index:3;pointer-events:none}
#controls>*{pointer-events:auto}
#joy{width:72px;height:72px;border-radius:50%;background:#ffffff28;border:2px solid #ffffff60;position:relative;flex-shrink:0}
#knob{position:absolute;width:30px;height:30px;left:21px;top:21px;border-radius:50%;background:#ffffffb8;pointer-events:none}
#actions{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#buttons{display:grid;grid-template-columns:repeat(3,min(48px,12.5vw));gap:3px}
#buttons button{width:min(48px,12.5vw);height:min(48px,12.5vw);margin:0;padding:1px;border-radius:50%;font-size:9px;background:rgba(230,238,238,.52);color:#123;line-height:1.05;user-select:none}
#buttons button:active{background:rgba(200,216,216,.72)}
#menuBtn{background:#3b5066;color:white;padding:6px 10px;font-size:11px;border-radius:10px}
#powerBarWrap{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:min(60%,220px);display:none;z-index:4;pointer-events:none}
#powerBarBg{width:100%;height:12px;background:#0a1a28;border:1px solid #ffffffaa;border-radius:8px;overflow:hidden;position:relative}
#powerBarFill{height:100%;width:0%;background:linear-gradient(90deg,#4ef4ff,#ffe447,#ff6b3d);border-radius:6px;transition:none}
#powerBarLabel{text-align:center;font-size:10px;font-weight:bold;margin-top:2px;text-shadow:0 1px 3px #000}
@media (hover:hover) and (pointer:fine){#pcHint{display:block!important}}
#gkPick{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(2,8,16,.72);text-align:center;pointer-events:auto}
#gkPick .gkT{font-size:22px;font-weight:900;letter-spacing:1px}
#gkPick .gkS{font-size:13px;color:#9fb4c8;margin-top:-6px}
#gkPick .gkB{display:flex;flex-direction:column;gap:14px}
#gkPick button{width:min(70vw,260px);padding:16px 10px;font-size:18px;border-radius:20px;margin:0;background:linear-gradient(180deg,#ffd978,#f0a92b);color:#2d1d00;box-shadow:0 6px 0 #9a6a10}
#gkPick button:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6a10}
#gkPick button i{display:block;font-style:normal;font-size:44px;line-height:1}
#gkPick button span{display:block;font-size:12px;letter-spacing:1px;margin-top:2px}

.bracket-wrap{display:flex;gap:26px;overflow-x:auto;align-items:stretch;padding:14px 8px 24px;max-width:95vw;margin:auto}.bracket-round{display:flex;flex-direction:column;justify-content:space-around;min-width:210px;gap:20px}.bracket-round h3{color:#ffd66b;margin:4px}.bracket-match{background:#132638;border:1px solid #56748c;border-radius:12px;padding:10px;text-align:left;box-shadow:0 3px 8px #0005;position:relative}.bracket-match div{padding:5px 2px;border-bottom:1px solid #ffffff20}.bracket-match div:last-child{border:0}.bracket-match .win{color:#7ee2a8;font-weight:bold}.bracket-match .score{float:right;color:#ffdc76}.bracket-round:not(:last-child) .bracket-match:after{content:'';position:absolute;right:-27px;top:50%;width:26px;border-top:2px solid #8ca9bd}.bracket-round:not(:first-child) .bracket-match:before{content:'';position:absolute;left:-14px;top:50%;height:2px;width:14px;background:#8ca9bd}

#menu{background:radial-gradient(ellipse at 50% -10%,#1f6b4a 0%,#0e2b3a 50%,#050d15 100%)!important}
#menu::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 44px,transparent 44px 88px)}
.panel{background:linear-gradient(160deg,rgba(34,54,76,.94),rgba(16,29,44,.96))!important;border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);border-radius:26px!important;padding:22px 18px!important;position:relative}
.logo{font-size:56px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.title{font-size:27px;font-weight:900;letter-spacing:2px;margin:6px 0 2px;background:linear-gradient(90deg,#fff,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:#9fb4c8;letter-spacing:1px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:bold;letter-spacing:1.5px;color:#8fa6bb;text-align:left;margin:14px 4px 6px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.32);border-radius:16px;padding:4px}
.seg button{flex:1;margin:0;padding:11px 2px;background:transparent;color:#b8c7d6;font-size:13px;border-radius:12px;box-shadow:none}
.seg button.on[data-d="facil"]{background:linear-gradient(180deg,#6af0a2,#2fc16b);color:#0c2a1a}
.seg button.on[data-d="medio"]{background:linear-gradient(180deg,#ffd978,#f0a92b);color:#2d1d00}
.seg button.on[data-d="dificil"]{background:linear-gradient(180deg,#ff8a7a,#e5483a);color:#fff}
.btn-main{width:100%;margin:14px 0 10px;padding:17px;font-size:20px;letter-spacing:1px;border-radius:18px;background:linear-gradient(180deg,#5bf09a,#2fc16b)!important;color:#0c2a1a!important;box-shadow:0 6px 0 #1b8a4a,0 12px 22px rgba(0,0,0,.4)}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 #1b8a4a}
/* ===== Botão / painel de personalização de partida (pré-jogo) ===== */
.ms-hero{text-align:center;margin:0 0 10px;padding:12px 10px 10px;border-radius:18px;background:linear-gradient(160deg,rgba(255,214,107,.18),rgba(67,209,125,.10),rgba(0,0,0,.25));border:1px solid rgba(255,214,107,.35);box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);position:relative;overflow:hidden}
.ms-hero::before{content:'';position:absolute;inset:-40% -20%;background:radial-gradient(circle at 30% 20%,rgba(255,214,107,.25),transparent 55%),radial-gradient(circle at 80% 80%,rgba(67,209,125,.2),transparent 50%);pointer-events:none;animation:msShine 4.5s ease-in-out infinite alternate}
.ms-hero .ms-title{position:relative;font-size:20px;font-weight:900;letter-spacing:1.5px;margin:0 0 4px;background:linear-gradient(90deg,#fff,#ffd66b,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.ms-hero .ms-sub{position:relative;font-size:11px;color:#c5d6e5;letter-spacing:.8px;margin:0}
.ms-vs{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(0,0,0,.4),rgba(20,40,60,.5));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ms-vs .side{flex:1;min-width:0;text-align:center}
.ms-vs .side .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 8px currentColor}
.ms-vs .side .nm{font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ms-vs .x{font-size:22px;font-weight:900;color:#ffd66b;text-shadow:0 0 12px rgba(255,214,107,.6);flex-shrink:0}
#btnStartMatch.ms-start{
  width:100%;margin:12px 0 8px;padding:18px 16px 20px;font-size:19px;font-weight:900;letter-spacing:1.5px;
  border-radius:20px;border:0;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#7dffb0 0%,#3ee87a 40%,#22c55e 100%)!important;
  color:#062415!important;
  box-shadow:0 0 0 0 rgba(67,209,125,.55),0 8px 0 #148a45,0 16px 32px rgba(0,0,0,.45),0 0 40px rgba(67,209,125,.35)!important;
  animation:msPulse 1.6s ease-in-out infinite;
  text-transform:uppercase;
}
#btnStartMatch.ms-start::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);animation:msSweep 2.8s ease-in-out infinite;
}
#btnStartMatch.ms-start:active{transform:translateY(5px);box-shadow:0 0 0 0 rgba(67,209,125,.4),0 3px 0 #148a45,0 8px 18px rgba(0,0,0,.4)!important;animation:none}
#btnStartMatch.ms-start:disabled,
#btnStartMatch.ms-start[style*="opacity: 0.45"],
#btnStartMatch.ms-start[style*="opacity:.45"]{
  animation:none!important;filter:grayscale(.35) brightness(.75);box-shadow:0 4px 0 #1a5c38,0 8px 16px rgba(0,0,0,.3)!important;
}
#btnStartMatch.ms-start .ms-ico{display:inline-block;font-size:22px;vertical-align:middle;margin-right:6px;animation:msBall 1.2s ease-in-out infinite}
@keyframes msPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(67,209,125,.5),0 8px 0 #148a45,0 16px 32px rgba(0,0,0,.45),0 0 28px rgba(67,209,125,.3)}
  50%{box-shadow:0 0 0 10px rgba(67,209,125,0),0 8px 0 #148a45,0 16px 32px rgba(0,0,0,.45),0 0 48px rgba(67,209,125,.55)}
}
@keyframes msSweep{0%{left:-60%}40%{left:120%}100%{left:120%}}
@keyframes msShine{from{opacity:.7;transform:translate(0,0)}to{opacity:1;transform:translate(4%,-3%)}}
@keyframes msBall{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ms-uniform{
  width:100%;margin:6px 0;padding:12px 10px;font-size:13px;font-weight:bold;border-radius:14px;
  background:linear-gradient(135deg,rgba(75,189,255,.2),rgba(255,156,66,.18))!important;
  color:#fff!important;border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.ms-back{background:#2a3d52!important;color:#c5d6e5!important;border-radius:14px;padding:11px 14px;font-size:13px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-sec{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;font-size:13px;border-radius:16px;background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid rgba(255,255,255,.13);box-shadow:none}
.btn-sec .ic{font-size:22px}.btn-sec b{font-size:12px;color:#7dffb0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:8px 12px;background:rgba(0,0,0,.25);border-radius:14px;font-size:14px;color:#dbe6f0}
.row select{padding:6px 10px;border-radius:10px;border:0;background:#2d4560;color:#fff;font-size:15px;font-weight:bold}
button:active{filter:brightness(.92)}
#buttons button,#pause,#menuBtn{box-shadow:none}


.panel .bracket-wrap,.panel .bracket-wrap *{touch-action:pan-x pan-y !important}
.bracket-wrap{max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.panel:has(.bracket-wrap){width:min(96vw,900px)}
@media (max-width:600px){.bracket-round{min-width:165px}}
#buttons button.big{font-size:10px}
#buttons button.sm{height:28px;border-radius:10px;font-size:8px;line-height:1.05;width:100%}
#buttons button#menuBtn{background:#3b5066;color:#fff;font-size:9px}
#controls,#pause{transition:opacity .45s ease}
body.celeb #controls,body.celeb #pause{opacity:0;pointer-events:none}
#buttons #crossBtn{grid-column:1/-1;width:100%;background:rgba(124,58,237,.92);color:#fff;font-size:9px}
#buttons #crossBtn.pulse{animation:crossPulse .7s infinite alternate;outline:3px solid #ffd66b}
@keyframes crossPulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
#buttons #requestPassBtn{background:rgba(47,123,255,.9);color:#fff}
#buttons #requestPassBtn:active{background:#1f5fd6}
#buttons #requestShotBtn{background:rgba(229,57,53,.92);color:#fff}
#buttons #requestShotBtn:active{background:#b71c1c}
/* ===== Placar de pênaltis ===== */
.pb-row{display:flex;align-items:center;gap:5px;margin:3px 0}
.pb-name{width:64px;text-align:left;overflow:hidden;text-overflow:ellipsis;font-size:9px}
.pb-ic{display:flex;gap:3px}
.pb-c{width:16px;height:16px;border-radius:50%;border:1px solid #ffffff55;font-size:10px;line-height:14px;text-align:center;background:#0006;font-weight:900}
.pb-c.ok{background:#2fc16b;color:#06210f;border-color:#6af0a2}
.pb-c.bad{background:#e5483a;color:#fff;border-color:#ff8a7a}
.pb-c.cur{border-color:#ffd66b;animation:pbcur .6s infinite alternate}
@keyframes pbcur{from{background:#ffd66b22}to{background:#ffd66b99}}
.pb-sc{font-size:15px;min-width:14px;color:#fff;text-align:right}
#penLog{position:absolute;top:78px;left:8px;z-index:2;display:none;pointer-events:none;background:rgba(8,24,39,.62);border:1px solid #ffffff22;border-radius:10px;padding:5px 7px;font-size:10px;max-width:min(52vw,215px)}
.pl-r{display:flex;align-items:center;gap:5px;margin:2px 0;white-space:nowrap}
.pl-n{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
/* ===== Tensão no pênalti decisivo ===== */
#tension{position:absolute;inset:0;z-index:9;pointer-events:none;display:none}
#tension .tVig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(110,0,0,.5) 75%,rgba(20,0,0,.92) 100%);opacity:.6}
#tension.beat .tVig{animation:tbeat .55s ease-out}
#tension .tBox{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:max-content;max-width:78vw;text-align:center;padding:5px 12px;border-radius:12px;background:rgba(40,0,0,.8);border:2px solid #ff4d4d;animation:tin .5s ease-out}
#tension .tBox b{display:block;font-size:15px;letter-spacing:1px;color:#ffd66b}
#tension .tBox span{font-size:11px;color:#fff}
#tension.beat .tBox{animation:tpop .45s ease-out}
@keyframes tbeat{0%{opacity:1}100%{opacity:.6}}
@keyframes tpop{0%{transform:translateX(-50%) scale(1.12);box-shadow:0 0 22px #ff2a2a}100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 #ff2a2a}}
@keyframes tin{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%);opacity:1}}

/* ===== Personalização de HUD/controles ===== */
body.ui-edit #menu{display:none!important}
body.ui-edit #controls,body.ui-edit #hud,body.ui-edit #pause{display:block!important}
body.ui-edit #controls{display:flex!important}
body.ui-edit #crossBtn,body.ui-edit #requestPassBtn,body.ui-edit #requestShotBtn,body.ui-edit #powerBarWrap{display:block!important}
body.ui-edit #powerBarWrap{pointer-events:auto}
body.ui-edit #joy,body.ui-edit #passBtn,body.ui-edit #shotBtn,body.ui-edit #runBtn,body.ui-edit #requestPassBtn,body.ui-edit #requestShotBtn,body.ui-edit #crossBtn,body.ui-edit #pause,body.ui-edit #hud,body.ui-edit #powerBarWrap{outline:2px dashed #ffd66b;outline-offset:3px;cursor:grab;opacity:1!important}
body.ui-edit #joy::after{content:'JOYSTICK';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffd66b;white-space:nowrap}
body.ui-edit #powerBarWrap::before{content:'BARRA DE FORÇA';display:block;text-align:center;font-size:9px;color:#ffd66b}
#layoutEd{display:none;position:fixed;inset:0;z-index:30;pointer-events:none;background:rgba(0,0,0,.25)}
#uiBg{display:none;position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(90deg,#1c5a38 0 70px,#1f6840 70px 140px)}
body.ui-solid #uiBg{display:block}
body.ui-solid #cv{visibility:hidden}
#layoutEd .ledBox{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,290px);background:rgba(10,24,38,.94);border:1px solid #ffffff33;border-radius:16px;padding:10px 12px;text-align:center;font-size:12px;box-shadow:0 10px 30px #000a}
#layoutEd .ledBox b{display:block;font-size:13px;letter-spacing:1px;color:#ffd66b}
#layoutEd .ledBox small{display:block;color:#9fb4c8;margin:2px 0 6px}
#layoutEd label{display:block;text-align:left;margin:4px 0;font-size:11px;color:#dbe6f0}
#layoutEd input[type=range]{width:100%;touch-action:pan-x;pointer-events:auto;height:22px}
#layoutEd .ledRow{display:flex;gap:4px;margin-top:6px}
#layoutEd .ledRow button{flex:1;margin:0;padding:9px 4px;font-size:11px;border-radius:10px;background:#3b5066;color:#fff}
#layoutEd .ledRow button.ok{background:#43d17d;color:#10251a}
.stadGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stadCard{background:#132638;border:2px solid #ffffff1a;border-radius:14px;padding:6px;cursor:pointer;text-align:center}
.stadCard.on{border-color:#ffd66b;box-shadow:0 0 0 2px #ffd66b55}
.stadCard canvas{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:4px}
.stadCard b{display:block;font-size:12px}
.stadCard small{display:block;font-size:10px;color:#9fb4c8;line-height:1.25;margin-top:2px}
.stadRand{aspect-ratio:320/220;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,#1b3a5a,#4a1b5a);border-radius:10px;margin-bottom:4px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" style="display:none"></div>
<button id="pause" onclick="pause()">Ⅱ</button>
<button id="replayBtn" onclick="playGoalReplay()" style="display:none;position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:4;background:linear-gradient(180deg,#ffe27a,#f0b42a);color:#241800;padding:5px 10px;font-size:10px;border-radius:10px;font-weight:800;letter-spacing:.3px;box-shadow:0 3px 0 #a87810,0 6px 12px #0005;border:0;line-height:1.2">▶ Replay</button>

<button id="introSkip" onclick="endIntro()" style="display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(8,20,32,.85);color:#fff;border:1px solid #ffffff55;padding:10px 22px">PULAR ▶</button>

<div id="gkPick">
  <div class="gkT">🧤 VOCÊ É O GOLEIRO</div>
  <div class="gkS">Escolha o canto para pular</div>
  <div class="gkB">
    <button onclick="pickKeeper(0)"><i>⬆</i><span>CANTO DE CIMA</span></button>
    <button onclick="pickKeeper(2)"><i>⬇</i><span>CANTO DE BAIXO</span></button>
  </div>
</div>

<div id="powerBarWrap">
  <div id="powerBarBg"><div id="powerBarFill"></div></div>
  <div id="powerBarLabel">FORÇA 0%</div>
</div>

<div id="controls">
  <div id="joy"><div id="knob"></div></div>
  <div id="actions">
    <div id="buttons">

/* ---------- geometria ---------- */
function stadSpecs(Fr,st){
  const rh=st.stand.rowH||10,R=st.stand.rows,g=STAD_GAP,WE=R[2]*rh;
  const x0=Fr.x-g-WE,x1=Fr.x+Fr.w+g+WE,len=x1-x0,yl=Fr.h+2*g;
  const rr=(st.roof&&st.roof.rows)||0;
  return [
    {k:'t',len:len,n:R[0],rh:rh,rr:rr,m:[1,0,0,-1,x0,Fr.y-g],u0:x0,horiz:1},
    {k:'b',len:len,n:R[1],rh:rh,rr:rr,m:[1,0,0,1,x0,Fr.y+Fr.h+g],u0:x0,horiz:1},
    {k:'l',len:yl,n:R[2],rh:rh,rr:Math.min(rr,1),m:[0,1,-1,0,Fr.x-g,Fr.y-g],u0:Fr.y-g,horiz:0},
    {k:'r',len:yl,n:R[2],rh:rh,rr:Math.min(rr,1),m:[0,1,1,0,Fr.x+Fr.w+g,Fr.y-g],u0:Fr.y-g,horiz:0}];
}
function stadVis(sp,V){
  const m=sp.m,d=sp.n*sp.rh,xs=[],ys=[];
  for(const [u,v] of [[0,0],[sp.len,0],[0,d],[sp.len,d]]){xs.push(m[0]*u+m[2]*v+m[4]);ys.push(m[1]*u+m[3]*v+m[5]);}
  return Math.max(...xs)>=V.x0&&Math.min(...xs)<=V.x1&&Math.max(...ys)>=V.y0&&Math.min(...ys)<=V.y1;
}
function fanCol(hh,t01,st){
  const P=st.stand.pal,p=22+Math.abs(t01-.5)*2*50;
  if(hh%100<p){const left=(t01<.5)!==!!sidesSwapped;return left?blueColor:orangeColor;}
  return P[(hh>>>7)%P.length];
}

/* ---------- arquibancadas + torcida ---------- */
function stadStands(c,Fr,V,st,T){
  const S=st.stand,exc=V.exc,specs=stadSpecs(Fr,st);
  // Torcida o jogo inteiro; no gol fica mais densa e animada.
  // Círculo simples (sem cabeça/braço todo frame) para manter fluido.
  const step = (S.wood?12:10) * (exc?1:1.25);
  const densMul = exc ? 0.95 : 0.72;
  for(const sp of specs){
    if(!stadVis(sp,V))continue;
    const m=sp.m,d=sp.n*sp.rh;
    c.save();c.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
    const gr=c.createLinearGradient(0,0,0,d);gr.addColorStop(0,S.c1);gr.addColorStop(1,S.c2);
    c.fillStyle=gr;c.fillRect(0,0,sp.len,d);
    for(let r=0;r<sp.n;r++){
      if(r&1){c.fillStyle=S.wood?'rgba(255,220,160,.07)':'rgba(255,255,255,.04)';c.fillRect(0,r*sp.rh,sp.len,sp.rh);}
      c.fillStyle=S.wood?'rgba(30,15,0,.55)':'rgba(0,0,0,.28)';c.fillRect(0,r*sp.rh+sp.rh-1,sp.len,S.wood?1.4:1);
    }
    c.fillStyle=st.wall;c.fillRect(0,-3,sp.len,3);c.fillStyle='rgba(255,255,255,.25)';c.fillRect(0,-3,sp.len,1);
    c.restore();
    const lo=(sp.horiz?V.x0:V.y0)-sp.u0-12,hi=(sp.horiz?V.x1:V.y1)-sp.u0+12;
    const i0=Math.max(0,Math.floor(lo/step)),i1=Math.min(Math.floor(sp.len/step),Math.ceil(hi/step));
    const rowsDraw = sp.n - sp.rr;
    const glow=S.fan==='light';
    const densLimit = Math.min(100, Math.floor(S.density * densMul));
    if(glow)c.globalCompositeOperation='lighter';
    for(let r=0;r<rowsDraw;r++){
      const v=(r+.5)*sp.rh,pc=sp.horiz?(m[5]+m[3]*v):(m[4]+m[2]*v);
      if(sp.horiz?(pc<V.y0-10||pc>V.y1+10):(pc<V.x0-10||pc>V.x1+10))continue;
      for(let i=i0;i<=i1;i++){
        const hh=sH(i,r,sp.k.charCodeAt(0));
        if(hh%100>=densLimit)continue;
        const u=i*step+(r&1)*step/2;
        const bob = exc ? -Math.abs(Math.sin(T*(2+(hh%3))+(hh%628)/100))*5 : 0;
        const x=m[0]*u+m[2]*v+m[4],y=m[1]*u+m[3]*v+m[5]+bob;
        const t01=sp.k==='l'?0:sp.k==='r'?1:(x-Fr.x)/Fr.w;
        const col=fanCol(hh,Math.max(0,Math.min(1,t01)),st);
        if(glow){
          c.fillStyle=col;c.globalAlpha=exc?0.95:0.6;c.beginPath();c.arc(x,y,2.4,0,6.283);c.fill();c.globalAlpha=1;
          continue;
        }
        c.fillStyle=col;c.beginPath();c.arc(x,y+1,3.4,0,6.283);c.fill();
        if(exc){
          const skin=STAD_SKIN[(hh>>>11)%5];
          c.fillStyle=skin;c.beginPath();c.arc(x,y-2.1,1.9,0,6.283);c.fill();
          if(S.flash && ((hh>>>5)+Math.floor(T*5)*7919)%210===0){
            c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(x,y-4,3.4,0,6.283);c.fill();
            c.globalCompositeOperation='source-over';
          }
        }
      }
    }
    if(glow)c.globalCompositeOperation='source-over';
    if(sp.rr>0&&st.roof&&st.roof.rows>0)stadRoof(c,sp,V,st,T);
  }
}
function stadRoof(c,sp,V,st,T){
  const R=st.roof,m=sp.m,v0=(sp.n-sp.rr)*sp.rh,v1=sp.n*sp.rh,h=v1-v0,len=sp.len;
  c.save();c.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
  c.fillStyle=R.col;c.fillRect(0,v0,len,h);
  if(R.type==='metal'){
    c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;c.beginPath();for(let u=0;u<len;u+=16){c.moveTo(u,v0);c.lineTo(u,v1);}c.stroke();
    c.fillStyle='#3a4766';c.fillRect(0,v0,len,2);
    if(R.lamps){c.fillStyle='#fff4c0';for(let u=8;u<len;u+=20){c.beginPath();c.arc(u,v0+1,1.5,0,6.283);c.fill();}}
  }else if(R.type==='thatch'){
    c.strokeStyle='rgba(90,60,10,.35)';c.lineWidth=1;c.beginPath();for(let u=0;u<len;u+=5){c.moveTo(u,v0);c.lineTo(u+4,v1);}c.stroke();
    c.strokeStyle='rgba(255,235,160,.25)';c.beginPath();for(let u=2;u<len;u+=9){c.moveTo(u,v0+2);c.lineTo(u+3,v1);}c.stroke();
    c.fillStyle='#a9863d';c.beginPath();c.moveTo(0,v0);for(let u=0;u<len;u+=8){c.lineTo(u+4,v0-4);c.lineTo(u+8,v0);}c.closePath();c.fill();
  }else if(R.type==='snow'){
    const g2=c.createLinearGradient(0,v0,0,v1);g2.addColorStop(0,'#ffffff');g2.addColorStop(1,'#c5d8ec');c.fillStyle=g2;c.fillRect(0,v0,len,h);
    c.fillStyle='#fff';for(let u=0;u<len;u+=9){c.beginPath();c.arc(u+4,v0,5+(u%3),0,6.283);c.fill();}
    c.fillStyle='rgba(120,160,200,.35)';c.fillRect(0,v1-2,len,2);
  }else if(R.type==='arcade'){
    c.fillStyle='rgba(40,18,6,.85)';
    if(h>=16)for(let u=0;u<len;u+=24){
      c.beginPath();c.moveTo(u+4,v0+2);c.lineTo(u+4,v1-12);c.arc(u+12,v1-12,8,Math.PI,0,true);c.lineTo(u+20,v0+2);c.closePath();c.fill();
    }
    c.fillStyle='rgba(255,230,180,.3)';c.fillRect(0,v0,len,1.5);c.fillStyle='rgba(60,25,8,.5)';c.fillRect(0,v1-1.5,len,1.5);
  }else if(R.type==='neon'){
    for(let u=0;u<len;u+=36){
      const hue=(u*.6+T*70)%360;c.strokeStyle='hsla('+hue+',100%,60%,.28)';c.lineWidth=5;c.beginPath();c.moveTo(u,v0+1);c.lineTo(u+37,v0+1);c.stroke();
      c.strokeStyle='hsl('+hue+',100%,68%)';c.lineWidth=1.6;c.beginPath();c.moveTo(u,v0+1);c.lineTo(u+37,v0+1);c.stroke();
    }
  }
  c.restore();
}

/* ---------- placas de publicidade ---------- */
function stadBoards(c,Fr,V,st,T){
  const B=st.boards,seg=58,th=7,x0=Fr.x-10,x1=Fr.x+Fr.w+10,y0=Fr.y-10,y1=Fr.y+Fr.h+3;
  c.font='bold 5.5px Arial';c.textAlign='center';c.textBaseline='middle';
  function paint(x,y,w,h,j){
    if(B.kind==='led'){c.fillStyle='#050818';c.fillRect(x,y,w,h);c.fillStyle='hsl('+((j*55+T*70)%360)+',100%,60%)';c.fillRect(x,y,w,1.2);c.fillStyle='hsl('+((j*55+T*70+120)%360)+',100%,75%)';}
    else{c.fillStyle=B.cols[j%B.cols.length];c.fillRect(x,y,w,h);
      if(B.kind==='wood'){c.fillStyle='rgba(0,0,0,.25)';c.fillRect(x,y+h/2,w,.8);}
      if(B.kind==='stone'){c.strokeStyle='rgba(255,226,160,.6)';c.lineWidth=.8;c.strokeRect(x+.5,y+.5,w-1,h-1);}
      c.fillStyle=B.txtc;}
    c.fillText(B.txt[j%B.txt.length],x+w/2,y+h/2+.5);
  }
  // topo e base
  for(const yy of [Fr.y-10,Fr.y+Fr.h+3]){
    if(yy+th<V.y0||yy>V.y1)continue;
    const j0=Math.max(0,Math.floor((V.x0-x0)/seg)),j1=Math.min(Math.ceil((x1-x0)/seg)-1,Math.floor((V.x1-x0)/seg));
    for(let j=j0;j<=j1;j++){const x=x0+j*seg,w=Math.min(seg,x1-x);if(w>0)paint(x,yy,w,th,j);}
  }
  // laterais (texto girado)
  for(const side of [0,1]){
    const xx=side?Fr.x+Fr.w+3:Fr.x-10;

/* ---------- objetos de iluminação / decoração (mundo) ---------- */
function stadTowerPts(Fr){return [[Fr.x-32,Fr.y-34],[Fr.x+Fr.w+32,Fr.y-34],[Fr.x-32,Fr.y+Fr.h+34],[Fr.x+Fr.w+32,Fr.y+Fr.h+34]];}
function stadTorchPts(Fr){const my=Fr.y+Fr.h/2;return [[Fr.x-28,Fr.y-30],[Fr.x+Fr.w+28,Fr.y-30],[Fr.x-28,Fr.y+Fr.h+30],[Fr.x+Fr.w+28,Fr.y+Fr.h+30],[Fr.x-28,my],[Fr.x+Fr.w+28,my]];}
function stadLightObjs(c,Fr,V,st,T){
  const L=st.light,vis=(x,y,r)=>x>V.x0-r&&x<V.x1+r&&y>V.y0-r&&y<V.y1+r;

      c.fillStyle='#2b3340';c.beginPath();c.arc(x,y,6,0,6.283);c.fill();
      c.save();c.translate(x,y);c.rotate(Math.atan2(cy-y,cx-x));
      c.fillStyle='#161b24';c.fillRect(2,-13,9,26);
      for(let a=0;a<2;a++)for(let b=0;b<4;b++){c.fillStyle=L.on?L.col:'#7c828d';c.beginPath();c.arc(5+a*4,-9+b*6,1.7,0,6.283);c.fill();}
      c.restore();
    }
  }else if(L.type==='torches'){
    for(const [x,y] of stadTorchPts(Fr)){
      if(!vis(x,y,30))continue;
      c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x+3,y+4,7,4,0,0,6.283);c.fill();
      c.fillStyle='#5a3a1c';c.beginPath();c.arc(x,y,6,0,6.283);c.fill();c.fillStyle='#2b1a0c';c.beginPath();c.arc(x,y,4,0,6.283);c.fill();
    }
  }else if(L.type==='ring'){
    const g=STAD_GAP,rh=st.stand.rowH||10,R=st.stand.rows,WE=R[2]*rh;
    const xa=Fr.x-g-WE,xb=Fr.x+Fr.w+g+WE,ya=Fr.y-g,yb=Fr.y+Fr.h+g;
    const strips=[[xa,ya,xb,ya,1],[xa,yb,xb,yb,1],[Fr.x-g,ya,Fr.x-g,yb,0],[Fr.x+Fr.w+g,ya,Fr.x+Fr.w+g,yb,0]];
    for(const [ax,ay,bx,by,h] of strips){
      const n=Math.ceil(Math.hypot(bx-ax,by-ay)/40);
      for(let i=0;i<n;i++){
        const t0=i/n,t1=(i+1)/n,x0=ax+(bx-ax)*t0,y0=ay+(by-ay)*t0,x1=ax+(bx-ax)*t1,y1=ay+(by-ay)*t1;
        if(Math.max(x0,x1)<V.x0||Math.min(x0,x1)>V.x1||Math.max(y0,y1)<V.y0||Math.min(y0,y1)>V.y1)continue;

        c.strokeStyle='hsl('+hue+',100%,70%)';c.lineWidth=1.8;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
      }

function stadRingNodes(Fr){const g=STAD_GAP+2;return [[Fr.x-g,Fr.y-g],[Fr.x+Fr.w+g,Fr.y-g],[Fr.x-g,Fr.y+Fr.h+g],[Fr.x+Fr.w+g,Fr.y+Fr.h+g]];}

function stadDecor(c,Fr,V,st,T){
  const D=st.decor||[],rh=st.stand.rowH||10,R=st.stand.rows,g=STAD_GAP,WE=R[2]*rh;
  if(D.includes('fence')){
    const rects=[[Fr.x-g,Fr.y-g,Fr.w+2*g,Fr.h+2*g]];
    for(const [x,y,w,h] of rects){
      c.strokeStyle='rgba(210,215,220,.85)';c.lineWidth=1.2;c.strokeRect(x,y,w,h);
      c.strokeStyle='rgba(210,215,220,.28)';c.lineWidth=.6;c.beginPath();
      for(let i=0;i<w;i+=5){if(x+i<V.x0-5||x+i>V.x1+5)continue;c.moveTo(x+i,y);c.lineTo(x+i+5,y+4);c.moveTo(x+i,y+h);c.lineTo(x+i+5,y+h-4);}
      for(let i=0;i<h;i+=5){if(y+i<V.y0-5||y+i>V.y1+5)continue;c.moveTo(x,y+i);c.lineTo(x+4,y+i+5);c.moveTo(x+w,y+i);c.lineTo(x+w-4,y+i+5);}
      c.stroke();

      for(let i=0;i<=w;i+=40){if(x+i>=V.x0-4&&x+i<=V.x1+4){c.fillRect(x+i-1,y-1.5,2,3);c.fillRect(x+i-1,y+h-1.5,2,3);}}
      for(let i=0;i<=h;i+=40){if(y+i>=V.y0-4&&y+i<=V.y1+4){c.fillRect(x-1.5,y+i-1,3,2);c.fillRect(x+w-1.5,y+i-1,3,2);}}
    }
  }
  if(D.includes('snowpiles')){
    const x0=Fr.x-g-1,y0=Fr.y-g-1,w=Fr.w+2*g+2,h=Fr.h+2*g+2;
    const blob=(x,y,i)=>{if(x<V.x0-10||x>V.x1+10||y<V.y0-10||y>V.y1+10)return;const r=3.5+(sH(i,3,9)%40)/10;
      c.fillStyle='rgba(120,150,190,.35)';c.beginPath();c.arc(x+1,y+1.5,r,0,6.283);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();};
    for(let i=0,x=x0;x<=x0+w;x+=11,i++){blob(x,y0+1,i);blob(x,y0+h-1,i+500);}

    const tree=(x,y,i)=>{if(x<V.x0-24||x>V.x1+24||y<V.y0-24||y>V.y1+24)return;const hh=sH(i,5,2),r=11+hh%6;
      c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.arc(x+3,y+4,r,0,6.283);c.fill();
      c.fillStyle='#1f4d24';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();
      c.fillStyle='#2f7a35';c.beginPath();c.arc(x-3,y-3,r*.68,0,6.283);c.fill();
      c.fillStyle='#4aa04c';c.beginPath();c.arc(x-5,y-5,r*.32,0,6.283);c.fill();};
    const house=(x,y,i)=>{if(x<V.x0-30||x>V.x1+30||y<V.y0-30||y>V.y1+30)return;const hh=sH(i,7,4);
      const cols=['#c8553d','#a8442f','#d97a3a','#8f3b2c'],wc=['#f2e3c6','#e8d3a8','#cfe3d4','#f4d9d0'];
      c.fillStyle='rgba(0,0,0,.28)';c.fillRect(x-14,y-9,32,24);c.fillStyle=wc[hh%4];c.fillRect(x-16,y-12,32,24);
      c.fillStyle=cols[(hh>>>3)%4];c.fillRect(x-16,y-12,32,12);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(x-16,y-6.5,32,1.4);

    for(let x=xa,i=0;x<=xb;x+=42,i++){const hh=sH(i,11,1);(hh%3===0?house:tree)(x,ytop-(hh>>>4)%5,i);(hh%4===1?house:tree)(x+16,ybot+(hh>>>6)%5,i+300);}
    for(let y=ytop+30,i=0;y<=ybot-30;y+=42,i++){const hh=sH(i,13,1);(hh%3===0?house:tree)(xa,y,i+600);(hh%3===1?house:tree)(xb,y,i+900);}
  }
  if(D.includes('palms')){
    const pts=[[Fr.x-36,Fr.y-38],[Fr.x+Fr.w+36,Fr.y-38],[Fr.x-36,Fr.y+Fr.h+38],[Fr.x+Fr.w+36,Fr.y+Fr.h+38],[Fr.x-40,Fr.y+Fr.h/2],[Fr.x+Fr.w+40,Fr.y+Fr.h/2]];

      c.fillStyle='#7a4e22';for(let k=0;k<3;k++){c.beginPath();c.arc(x+Math.cos(k*2.1)*3,y+Math.sin(k*2.1)*3,1.8,0,6.283);c.fill();}
    });
  }
}

/* ---------- etapa 1: fundo (apron, arquibancadas, placas, luzes, decoração) ---------- */

function stadDecorBack(){}

/* ---------- etapa 2: gramado (padrões, textura, remendos, sombras) ---------- */

    x.strokeStyle=(hh&1)?'rgba(255,255,255,.075)':'rgba(0,25,0,.09)';x.lineWidth=1;

  }

function stadPatches(st){

    if(P.edge){const s=hh%4;if(s===0)ny=.02+ny*.08;else if(s===1)ny=.98-ny*.08;else if(s===2)nx=.01+nx*.04;else nx=.99-nx*.04;}
    if(P.goal&&i<8){nx=(i&1)?.965:.035;ny=.5+((hh%100)-50)/260;}
    if(P.goal&&i>=8&&i<10){nx=.5;ny=.5;}
    out.push({nx:nx,ny:ny,r:P.edge?(3+(hh>>>5)%6):(7+(hh>>>5)%12),k:.55+((hh>>>9)%50)/100});
  }}

function stadGrass(c,Fr,V,st,T){

/* ---------- etapa 3: iluminação, clima do ambiente e efeitos (espaço de tela) ---------- */
function stadShadeCv(w,h){

}
function stadOver(c,Fr,V,st,T){

    } else {
    const sc=V.preview?1:.33,sw=Math.max(2,Math.ceil(W*sc)),shh=Math.max(2,Math.ceil(H*sc));

    x.globalCompositeOperation='destination-out';
    const hole=(px,py,rx,ry,a)=>{

      const gr=x.createRadialGradient(0,0,0,0,0,1);gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(.62,'rgba(0,0,0,'+(a*.82)+')');gr.addColorStop(1,'rgba(0,0,0,0)');

    };

    const fa=lit?(L.type==='string'?.7:L.type==='torches'?.55:.94):.0;
    if(fa>0)hole(sx(Fr.x+Fr.w/2),sy(Fr.y+Fr.h/2),Fr.w*.68*s,Fr.h*.66*s,fa);
    const R=Math.min(260,.34*Math.max(Fr.w,Fr.h))*s;
    if(L.type==='towers'&&lit)for(const [px,py] of stadTowerPts(Fr))hole(sx(px),sy(py),R,R,.8);
    else if(L.type==='torches')for(const [px,py] of stadTorchPts(Fr))hole(sx(px),sy(py),R*.55,R*.55,.55);
    else if(L.type==='ring')for(const [px,py] of stadRingNodes(Fr))hole(sx(px),sy(py),R*.7,R*.7,.5);
    else if(L.type==='string')for(const wr of stadStringWires(Fr,V))hole(sx(wr.mx),sy(wr.my),110*s,60*s,.45);

    }
  }
  // 2) brilhos das fontes de luz — só no preview/celebração (caro por frame)
  if(!V.preview && !exc){
    // vinheta leve e efeitos de clima; sem holofotes animados
    if(A.vig){
      const gr=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.75);
      gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+A.vig+')');c.fillStyle=gr;c.fillRect(0,0,W,H);
    }

  }
  c.save();c.globalCompositeOperation='lighter';
  const vis=(x,y,r)=>x>V.x0-r&&x<V.x1+r&&y>V.y0-r&&y<V.y1+r;
  if(L.type==='towers'&&L.on){
    for(const [px,py] of stadTowerPts(Fr)){
      if(!vis(px,py,80))continue;const X=sx(px),Y=sy(py),r=46*s*(1+.35*strobe);
      const gr=c.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba(255,250,225,.95)');gr.addColorStop(.16,'rgba(255,244,200,.6)');gr.addColorStop(.5,'rgba(255,240,190,.15)');gr.addColorStop(1,'rgba(255,240,190,0)');
      c.fillStyle=gr;c.fillRect(X-r,Y-r,2*r,2*r);
      c.strokeStyle='rgba(255,248,215,'+(.5+.3*strobe)+')';c.lineWidth=1.3;c.beginPath();
      for(let k=0;k<4;k++){const a=k*Math.PI/4+.2,l=r*1.35;c.moveTo(X-Math.cos(a)*l,Y-Math.sin(a)*l);c.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);}c.stroke();
    }
  }else if(L.type==='torches'){
    for(const [px,py] of stadTorchPts(Fr)){
      if(!vis(px,py,80))continue;const X=sx(px),Y=sy(py),fl=.8+.2*Math.sin(T*13+px)+.1*Math.sin(T*27+py),r=40*s*fl;
      const gr=c.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba(255,210,110,.55)');gr.addColorStop(.4,'rgba(255,140,40,.22)');gr.addColorStop(1,'rgba(255,100,20,0)');
      c.fillStyle=gr;c.fillRect(X-r,Y-r,2*r,2*r);
    }
    c.globalCompositeOperation='source-over';
    for(const [px,py] of stadTorchPts(Fr)){
      if(!vis(px,py,40))continue;const X=sx(px),Y=sy(py);
      for(let k=0;k<4;k++){
        const ph=T*9+px*.3+k*1.7,fh=(9-k*1.6+Math.sin(ph)*2.4)*s,fw=(4.6-k*.9)*s,ox=Math.sin(ph*.7)*1.2*s;
        c.fillStyle=['rgba(255,90,20,.85)','rgba(255,150,30,.9)','rgba(255,205,70,.95)','rgba(255,245,170,.95)'][k];
        c.beginPath();c.moveTo(X-fw,Y);c.quadraticCurveTo(X-fw*.7+ox,Y-fh*.6,X+ox,Y-fh);c.quadraticCurveTo(X+fw*.7+ox,Y-fh*.6,X+fw,Y);c.closePath();c.fill();
      }
    }
    c.globalCompositeOperation='lighter';
  }else if(L.type==='string'){
    const cols=['#ffd27a','#ff8a5c','#9ad1ff','#b6f28a'];
    for(const wr of stadStringWires(Fr,V)){
      for(let k=0;k<=7;k++){
        const t=k/7,bx=(1-t)*(1-t)*wr.ax+2*t*(1-t)*wr.mx+t*t*wr.bx,by=(1-t)*(1-t)*wr.ay+2*t*(1-t)*wr.my+t*t*wr.by;
        if(!vis(bx,by,8))continue;
        const X=sx(bx),Y=sy(by),fl=.75+.25*Math.sin(T*4+k*1.3+wr.x),col=cols[(k+(wr.top?0:2))%4];
        c.globalAlpha=.28*fl;c.fillStyle=col;c.beginPath();c.arc(X,Y,5.2*s,0,6.283);c.fill();
        c.globalAlpha=.95;c.beginPath();c.arc(X,Y,1.6*s,0,6.283);c.fill();
      }
    }
    c.globalAlpha=1;
  }else if(L.type==='ring'){
    for(const [px,py] of stadRingNodes(Fr)){if(!vis(px,py,40))continue;const X=sx(px),Y=sy(py),r=24*s,hue=(T*80)%360;
      const gr=c.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'hsla('+hue+',100%,70%,.8)');gr.addColorStop(1,'hsla('+hue+',100%,60%,0)');c.fillStyle=gr;c.fillRect(X-r,Y-r,2*r,2*r);}
  }
  c.restore();
  // 3) tom do ambiente
  if(A.grad){
    const q=A.grad,gr=c.createLinearGradient(q.a[0]*W,q.a[1]*H,q.b[0]*W,q.b[1]*H);
    for(const [o,col] of q.stops)gr.addColorStop(o,col);c.fillStyle=gr;c.fillRect(0,0,W,H);
  }
  if(A.vig){
    const gr=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.75);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+A.vig+')');c.fillStyle=gr;c.fillRect(0,0,W,H);
  }
  // 4) efeitos
  stadFx(c,Fr,V,st,T);
  // 5) confete / fogos de gol (duração ~7s)
  const dt=T-stadBurstT;
  if(!V.preview&&dt>=0&&dt<7){
    const pal=[blueColor,orangeColor,'#ffd84d','#ffffff','#ff6bd6','#6bf2ff'];
    for(let i=0;i<80;i++){
      const hh=sH(i,31,9),left=hh&1,ox=left?W*.08:W*.92,oy=H*.28;
      const vx=(left?1:-1)*(60+(hh>>>3)%190),vy=-(120+(hh>>>9)%260);
      // reinicia ondas a cada ~2.3s para os fogos continuarem os 7s
      const wave = dt % 2.3;
      const px=ox+vx*wave*.9,py=oy+vy*wave+170*wave*wave;
      if(py>H+10||py<-20)continue;
      c.globalAlpha=Math.max(0,Math.min(1,(7-dt)*0.9))*Math.max(0,Math.min(1,(2.3-wave)*1.2));
      c.fillStyle=pal[hh%pal.length];
      const fl=Math.abs(Math.cos(T*9+i));c.fillRect(px,py,1.5+3.4*fl,1.8+1.5*(1-fl));
    }

  }
}
function stadFx(c,Fr,V,st,T){
  // Efeitos pesados (lasers, brasas, muitos flocos) só no preview/celebração.
  if(!V.preview && !V.exc && st.fx!=='snow' && st.fx!=='birds') return;
  const W=V.w,H=V.h,s=V.s,q=V.preview?.55:1;
  if(st.fx==='snow'){
    // Neve simples: poucos pontos caindo em linha reta
    c.fillStyle='rgba(255,255,255,.75)';
    const n = V.preview?14:12;
    for(let i=0;i<n;i++){
      const x=((i*73 + T*18)%(W+40))-20;
      const y=((i*97 + T*32)%(H+30))-15;
      c.fillRect(x, y, 2, 2);
    }
  }else if(st.fx==='embers'){
    c.save();c.globalCompositeOperation='lighter';
    for(let i=0;i<(V.preview?12:18);i++){
      const hh=sH(i,9,4),sp=18+(hh%30),y=H-((T*sp+((hh>>>8)%1000)/1000*H)%(H+30))+10;
      const x=((hh%1000)/1000)*W+Math.sin(T*1.3+i)*14,a=.35+.35*Math.sin(T*6+i);
      c.fillStyle='rgba(255,'+(130+hh%80)+',50,'+a+')';c.beginPath();c.arc(x,y,(1+(hh%3)*.5)*q,0,6.283);c.fill();
    }
    c.restore();
  }else if(st.fx==='lasers'){
    c.save();c.globalCompositeOperation='lighter';
    const nodes=stadRingNodes(Fr),len=Math.max(W,H)*.75;
    nodes.forEach(([px,py],i)=>{
      const X=px*s+V.ox,Y=py*s+V.oy,base=[.8,Math.PI-.8,-.8,Math.PI+.8][i];
      for(let b=0;b<2;b++){
        const a=base+Math.sin(T*(.9+b*.4)+i*1.7)*.8*(i>1?-1:1)+(b?.35:0),hue=((i*70+b*160+T*50)%360);
        const gr=c.createLinearGradient(X,Y,X+Math.cos(a)*len,Y+Math.sin(a)*len);
        gr.addColorStop(0,'hsla('+hue+',100%,65%,.45)');gr.addColorStop(.6,'hsla('+hue+',100%,60%,.08)');gr.addColorStop(1,'hsla('+hue+',100%,60%,0)');
        c.strokeStyle=gr;c.lineWidth=1.4*q;c.beginPath();c.moveTo(X,Y);c.lineTo(X+Math.cos(a)*len,Y+Math.sin(a)*len);c.stroke();
        c.lineWidth=6*q;c.globalAlpha=.07;c.stroke();c.globalAlpha=1;
      }
    });
    for(let i=0;i<(V.preview?10:18);i++){
      const hh=sH(i,5,6),x=((hh%1000)/1000)*W+Math.sin(T*.6+i)*10,y=H-((T*(10+hh%18)+((hh>>>8)%1000)/1000*H)%(H+10));
      c.fillStyle='hsla('+((hh%2)?180:310)+',100%,70%,.55)';c.beginPath();c.arc(x,y,1.3*q,0,6.283);c.fill();
    }
    c.restore();
  }else if(st.fx==='birds'){
    c.strokeStyle='rgba(20,28,20,.55)';c.lineWidth=1.3*q;
    for(let i=0;i<4;i++){
      const x=((T*(24+i*7)+i*150)%(W+120))-60,y=H*(.14+.06*i)+Math.sin(T*.7+i)*8,fl=Math.sin(T*9+i*2)*3*q,sz=7*q;
      c.beginPath();c.moveTo(x-sz,y+fl);c.quadraticCurveTo(x-sz*.4,y-sz*.3,x,y);c.quadraticCurveTo(x+sz*.4,y-sz*.3,x+sz,y+fl);c.stroke();
    }
  }
}

/* ---------- cache do estádio (arquibancada + gramado) ----------
   Desenhar milhares de torcedores todo frame era a principal causa da trava.
   Agora o fundo estático é pintado uma vez num canvas e só copiado a cada frame. */
let stadCache=null;
function stadCacheGet(st){
  const dpr=Math.min(devicePixelRatio||1,1.5);
  const rh=st.stand.rowH||10,R=st.stand.rows,gp=STAD_GAP,WE=R[2]*rh;
  const bx0=Math.floor(F.x-gp-WE-14),bx1=Math.ceil(F.x+F.w+gp+WE+14);
  const by0=Math.floor(F.y-gp-R[0]*rh-14),by1=Math.ceil(F.y+F.h+gp+R[1]*rh+14);
  const key=[st.id,F.x,F.y,F.w,F.h,dpr,sidesSwapped?1:0,blueColor,orangeColor].join('|');
  if(stadCache&&stadCache.key===key)return stadCache;
  let sc=dpr,w=Math.ceil((bx1-bx0)*sc),h=Math.ceil((by1-by0)*sc);
  if(w>4096||h>4096){sc=sc*Math.min(4096/w,4096/h);w=Math.ceil((bx1-bx0)*sc);h=Math.ceil((by1-by0)*sc);}
  const cvs=(stadCache&&stadCache.cv)||document.createElement('canvas');
  cvs.width=w;cvs.height=h;
  const c=cvs.getContext('2d');
  c.setTransform(sc,0,0,sc,-bx0*sc,-by0*sc);
  const V={w:bx1-bx0,h:by1-by0,s:1,ox:0,oy:0,x0:-1e6,x1:1e6,y0:-1e6,y1:1e6,T:0,exc:0,preview:0};
  stadBack(c,F,V,st,0);
  stadGrass(c,F,V,st,0);
  stadCache={key:key,cv:cvs,x:bx0,y:by0,w:bx1-bx0,h:by1-by0};
  return stadCache;
}

/* ---------- câmera/visão ---------- */
function stadView(c,T,exc){
  const m=c.getTransform(),k=cv.width/cw,s=m.a/k,ox=m.e/k,oy=m.f/k;
  return {w:cw,h:ch,s:s,ox:ox,oy:oy,x0:-ox/s-24,x1:(cw-ox)/s+24,y0:-oy/s-24,y1:(ch-oy)/s+24,T:T,exc:exc};
}

/* ---------- pré-visualização (menu) ---------- */
function stadPaintPreview(cvEl,st){
  const c=cvEl.getContext('2d'),w=cvEl.width,h=cvEl.height;
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);
  const Fr={x:70,y:90,w:300,h:150},rh=st.stand.rowH||10,R=st.stand.rows,g=STAD_GAP,WE=R[2]*rh;
  const bx0=Fr.x-g-WE-6,bx1=Fr.x+Fr.w+g+WE+6,by0=Fr.y-g-R[0]*rh-6,by1=Fr.y+Fr.h+g+R[1]*rh+6;
  const s=Math.min(w/(bx1-bx0),h/(by1-by0)),ox=(w-(bx1-bx0)*s)/2-bx0*s,oy=(h-(by1-by0)*s)/2-by0*s;
  c.fillStyle=st.outer;c.fillRect(0,0,w,h);
  const T=1.7,V={w:w,h:h,s:s,ox:ox,oy:oy,x0:-9999,x1:9999,y0:-9999,y1:9999,T:T,exc:0,preview:1};
  c.save();c.translate(ox,oy);c.scale(s,s);
  stadBack(c,Fr,V,st,T);stadGrass(c,Fr,V,st,T);
  c.strokeStyle=st.line;c.lineWidth=1.6;c.strokeRect(Fr.x,Fr.y,Fr.w,Fr.h);
  c.beginPath();c.moveTo(Fr.x+Fr.w/2,Fr.y);c.lineTo(Fr.x+Fr.w/2,Fr.y+Fr.h);c.stroke();
  c.beginPath();c.arc(Fr.x+Fr.w/2,Fr.y+Fr.h/2,Fr.h*.14,0,6.283);c.stroke();
  c.strokeRect(Fr.x,Fr.y+Fr.h*.29,Fr.w*.16,Fr.h*.42);c.strokeRect(Fr.x+Fr.w*.84,Fr.y+Fr.h*.29,Fr.w*.16,Fr.h*.42);
  c.restore();
  stadOver(c,Fr,V,st,T);
}

// ===== CLIMA (sol / chuva / neblina) — altera o visual do campo =====
let weather = 'sol'; // 'sol' | 'chuva' | 'neblina'
let rainDrops = [];
const WEATHER_INFO = {
  sol:     {label:'☀️ SOL',     icon:'☀️', bg:'#1a2e1f', stripeA:'#2b874b', stripeB:'#248046', line:'#e6f5e8'},
  chuva:   {label:'🌧️ CHUVA',  icon:'🌧️', bg:'#0f1c18', stripeA:'#1a5c38', stripeB:'#154f30', line:'#a8c4b0'},
  neblina: {label:'🌫️ NEBLINA',icon:'🌫️', bg:'#1a2428', stripeA:'#2a6b4a', stripeB:'#236040', line:'#c8d8cc'}
};
function pickWeather(){
  const pool = curStadium && curStadium.pool;
  if(pool && pool.length) weather = pool[Math.floor(Math.random()*pool.length)];
  else {
    const r = Math.random();
    if(r < 0.42) weather = 'sol';
    else if(r < 0.74) weather = 'chuva';
    else weather = 'neblina';
  }
  initRainParticles();
}
function stadWeatherLabel(wi){
  if(weather==='sol' && curStadium && curStadium.sunLabel) return curStadium.sunLabel;
  return wi.icon+' '+wi.label.replace(/^\S+\s/,'');
}
function initRainParticles(){
  rainDrops = [];
  if(weather !== 'chuva') return;
  // Chuva simples: poucas linhas iguais
  const n = 28;
  for(let i=0;i<n;i++){
    rainDrops.push({
      x: Math.random() * ((cw||400)+40) - 20,
      y: Math.random() * ((ch||700)+80) - 40,
      len: 12,
      spd: 420
    });
  }
}
function stepRain(dt){
  if(weather !== 'chuva' || !rainDrops.length) return;
  const W = cw || 400, H = ch || 700;
  for(const d of rainDrops){
    d.y += d.spd * dt;
    d.x += d.spd * 0.12 * dt;
    if(d.y > H + 20){ d.y = -15; d.x = Math.random()*(W+20)-10; }
    if(d.x > W + 20) d.x = -10;
  }
}
function drawWeatherOverlay(){
  if(weather === 'chuva'){
    g.save();
    g.strokeStyle = 'rgba(170,200,230,0.4)';
    g.lineWidth = 1.2;
    g.beginPath();
    for(const d of rainDrops){
      g.moveTo(d.x, d.y);
      g.lineTo(d.x + 3, d.y + d.len);
    }
    g.stroke();
    g.fillStyle = 'rgba(30,50,80,0.1)';
    g.fillRect(0,0,cw,ch);
    g.restore();
  } else if(weather === 'neblina'){
    g.save();
    g.fillStyle = 'rgba(150,165,180,0.22)';
    g.fillRect(0,0,cw,ch);
    g.restore();
  } else if(weather === 'sol' && !(curStadium && curStadium.nosun)){
    g.save();
    const sg = g.createRadialGradient(cw*0.12, ch*0.08, 10, cw*0.12, ch*0.08, Math.min(cw,ch)*0.55);
    sg.addColorStop(0, 'rgba(255,240,160,0.22)');
    sg.addColorStop(0.4, 'rgba(255,220,100,0.08)');
    sg.addColorStop(1, 'rgba(255,200,80,0)');
    g.fillStyle = sg;
    g.fillRect(0,0,cw,ch);
    g.restore();
  }
}

function size() {
  cw = innerWidth;
  ch = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.floor(cw * dpr);
  cv.height = Math.floor(ch * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bottomSpace = 96;
  const topSpace = 36;
  const viewW = cw - 16, viewH = Math.max(200, ch - topSpace - bottomSpace);
  F = {
    x: 8,
    y: topSpace,
    w: viewW * fieldScale,
    h: viewH * fieldScale
  };
  camReady = false;

  if (all.length) {
    for (const p of all) {
      p.x = F.x + p.homeX * F.w;
      p.y = F.y + p.homeY * F.h;
    }
    if (ball) {
      if (!active) {
        ball.x = F.x + F.w / 2;
        ball.y = F.y + F.h / 2;
      } else {
        ball.x = clamp(ball.x, F.x + 4, F.x + F.w - 4);
        ball.y = clamp(ball.y, F.y + 4, F.y + F.h - 4);
      }
    }
  }
  if(weather === 'chuva') initRainParticles();
}

function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function botShoot(h){
  touch(h);
  shots[h.team]++;
  const goalX=(h.team ^ (sidesSwapped?1:0)) ? F.x+18 : F.x+F.w-18;
  const gHalf=F.h*0.10, power=0.8+Math.random()*0.2;
  const aimY=F.y+F.h/2+(Math.random()*2-1)*gHalf*0.8;
  const sv=norm(goalX-h.x,aimY-h.y), spd=8.5+power*4;
  ball.x=h.x+sv.x*(h.r+ball.r+4); ball.y=h.y+sv.y*(h.r+ball.r+4);
  ball.vx=sv.x*spd; ball.vy=sv.y*spd;
  h.cool=1.2*coolMul(h);
}
function requestShot(){

    const h=teamA.find(a=>a.role!=='GK'&&a!==selected()&&dist(a,ball)<a.r+ball.r+6);

  }
}
function drawCrowd(){
  const t=performance.now()/1000;
  const exc=(goalFreeze>0||(goalBanner&&goalBanner.time>0))?1:0;
  const pal=[blueColor,orangeColor,'#ffffff','#ffd84d','#e0525c','#7dffb0','#c9b6ff','#ff7ad9'];
  const step=9;
  const stands=[{y:F.y-34,rows:3,side:0},{y:F.y+F.h+3,rows:7,side:1}];
  const i0=Math.max(0,Math.floor((camX-F.x-12)/step)), i1=Math.min(Math.ceil(F.w/step),Math.ceil((camX+(intro?F.w+F.x+60:cw)-F.x+12)/step));
  for(const s of stands){
    const h=s.rows*10+4;
    const gr=g.createLinearGradient(0,s.y,0,s.y+h);
    gr.addColorStop(0,s.side?'#26394a':'#15212c');gr.addColorStop(1,s.side?'#15212c':'#26394a');
    g.fillStyle=gr;g.fillRect(F.x-8,s.y,F.w+16,h);
    for(let r=0;r<s.rows;r++){
      const ry=s.y+8+r*10;
      for(let i=i0;i<=i1;i++){
        const hh=((i*73856093)^(r*19349663)^((s.side+1)*83492791))>>>0;
        const ph=(hh%628)/100, sp=2+(hh%3);
        const bob=-Math.abs(Math.sin(t*sp+ph))*(exc?5:1.4);
        const x=F.x+i*step+(r%2)*4.5, y=ry+bob;
        g.fillStyle=pal[(hh>>>3)%pal.length];
        g.beginPath();g.arc(x,y+2,3.4,0,Math.PI*2);g.fill();
        g.fillStyle='#f1c9a0';
        g.beginPath();g.arc(x,y-2.2,2,0,Math.PI*2);g.fill();
      }
    }
  }
}

function drawPlayerKit(ctx,x,y,r,kit,isGk,num,highlight){
  const prim=isGk?kit.gkPrimary:kit.primary;
  const sec=isGk?kit.gkSecondary:kit.secondary;
  const accent=kit.accent;
  const numCol=isGk?kit.gkNumber:kit.number;
  const stroke=kit.stroke;
  const style=isGk?'solid':(kit.style||'solid');
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.closePath();
  ctx.fillStyle=prim;ctx.fill();
  ctx.clip();
  if(style==='vstripes'){
    const w=Math.max(2,r*0.28);
    ctx.fillStyle=sec;
    for(let i=-r;i<r;i+=w*2){ctx.fillRect(x+i,y-r,w,r*2);}
  }else if(style==='hstripes'){
    const h=Math.max(2,r*0.28);
    ctx.fillStyle=sec;
    for(let i=-r;i<r;i+=h*2){ctx.fillRect(x-r,y+i,r*2,h);}
  }else if(style==='halves'){
    ctx.fillStyle=sec;ctx.fillRect(x,y-r,r,r*2);
  }else if(style==='sash'){
    ctx.strokeStyle=accent||sec;ctx.lineWidth=Math.max(3,r*0.45);
    ctx.beginPath();ctx.moveTo(x-r*0.9,y+r*0.85);ctx.lineTo(x+r*0.9,y-r*0.85);ctx.stroke();
  }else if(style==='dots'){
    ctx.fillStyle=sec;
    const step=Math.max(3,r*0.45);
    for(let dy=-r;dy<=r;dy+=step)for(let dx=-r;dx<=r;dx+=step){
      if(dx*dx+dy*dy<r*r*0.85){ctx.beginPath();ctx.arc(x+dx,y+dy,Math.max(1.2,r*0.12),0,Math.PI*2);ctx.fill();}
    }
  }else if(style==='chevron'){
    ctx.strokeStyle=sec;ctx.lineWidth=Math.max(2.5,r*0.32);ctx.lineJoin='round';
    for(let k=0;k<3;k++){
      const oy=-r*0.35+k*r*0.38;
      ctx.beginPath();ctx.moveTo(x-r*0.7,y+oy+r*0.25);ctx.lineTo(x,y+oy-r*0.15);ctx.lineTo(x+r*0.7,y+oy+r*0.25);ctx.stroke();
    }
  }
  if(!isGk && style!=='solid'){
    ctx.fillStyle=accent||sec;
    ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(x,y-r*0.72,r*0.22,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1.2,r*0.18);ctx.stroke();
  if(num!=null){
    ctx.fillStyle=numCol;ctx.font='bold '+Math.max(8,r*1.45)+'px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(num),x,y);
  }
  if(highlight){
    ctx.beginPath();ctx.arc(x,y,r+3.5,0,Math.PI*2);
    ctx.strokeStyle='#fff34c';ctx.lineWidth=2;ctx.stroke();
  }
}

function leagueSchedule(keys,legs){

// ===== PLACAR DE PÊNALTIS + TENSÃO DA COBRANÇA DECISIVA =====
// Cobrança decisiva = última da rodada (quem bate depois) em que marcar muda o jogo:
// empatado (marcar vence) ou perdendo por 1 (precisa marcar ou perde).
// A disputa acaba quando um time não consegue mais alcançar o outro.
function penEnds(b,o,a0,a1){
  if(a0>=5&&a1>=5)return a0===a1&&b!==o; // morte súbita: só decide ao fim da rodada
  const l0=Math.max(0,5-a0),l1=Math.max(0,5-a1);
  return b>o+l1||o>b+l0;
}
// Cutscene de tensão: aparece sempre que a cobrança que vai ser batida decide a disputa
// (gol = vitória de quem bate) ou quando errar significa derrota.
function penTensionInfo(){
  if(!pen)return null;
  const t=pen.currentTeam,ot=1-t;
  const sT=t===0?pen.blue:pen.orange,sO=t===0?pen.orange:pen.blue;
  const aT=pen.attempts[t]+1,aO=pen.attempts[ot];
  const a0=t===0?aT:aO,a1=t===0?aO:aT;
  const pair=(x,y)=>t===0?[x,y]:[y,x];
  const g2=pair(sT+1,sO),m2=pair(sT,sO);
  const nm=t===0?teamBlueName:teamOrangeName;
  if(penEnds(g2[0],g2[1],a0,a1)&&sT+1>sO)return {title:'⚠ PÊNALTI DECISIVO',sub:nm+': SE MARCAR, VENCE!'};
  if(penEnds(m2[0],m2[1],a0,a1)&&sO>sT)return {title:'⚠ PÊNALTI DECISIVO',sub:nm+': PRECISA MARCAR OU PERDE!'};
  return null;
}
function penTensionInfoOld(){
  if(!pen)return null;
  const t=pen.currentTeam,o=1-t,at=pen.attempts[t]+1,ao=pen.attempts[o];
  if(at<5||at!==ao)return null;
  const sT=t===0?pen.blue:pen.orange,sO=t===0?pen.orange:pen.blue,diff=sT-sO;
  if(diff>0||diff<-1)return null;
  const nm=t===0?teamBlueName:teamOrangeName;
  return {title:'⚠ PÊNALTI DECISIVO',sub:diff===0?nm+': SE MARCAR, VENCE!':nm+': PRECISA MARCAR OU PERDE!'};
}
function showTension(on,title,sub){

  if(!on){el.style.display='none';el.classList.remove('beat');return;}

function thump(c,t0,f,g0){
  const o=c.createOscillator(),gn=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(38,t0+0.16);
  gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(g0,t0+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
  o.connect(gn);gn.connect(c.destination);o.start(t0);o.stop(t0+0.26);
}
function heartbeat(){

function tensionTick(dt){

  if(pen.phase==='shot'&&pen.shotTimer<=0.72){showTension(false);pen.tense=false;return;} // revela o resultado
  pen.tenseT+=dt;pen.beatT-=dt;
  if(pen.beatT<=0){pen.beatT=Math.max(0.42,0.95-pen.tenseT*0.07);heartbeat();} // coração acelera com o tempo
}

function preparePenalty(){
  if(!pen)return;
  const team=pen.turn%2===0?pen.firstTeam:1-pen.firstTeam;
  pen.currentTeam=team;
  const spotX=F.x+F.w*0.78, cy=F.y+F.h/2;
  const list=team===0?teamA:teamB;
  const shooters=list.filter(p=>p.role!=='GK');
  const shooter=shooters[pen.attempts[team]%shooters.length];
  pen.shooter=shooter; pen.phase=(team===1)?'pick':'ready'; pen.shotTimer=0.65+Math.random()*0.45; pen.userLane=null;
  for(const p of all){ p.x=F.x+p.homeX*F.w; p.y=F.y+p.homeY*F.h; }
  // A cobrança fica sempre no mesmo lado, na marca, com o jogador atrás da bola.
  if(shooter){shooter.x=spotX-26; shooter.y=cy;}
  ball.x=spotX; ball.y=cy; ball.vx=ball.vy=0;
  // Apenas o goleiro da equipe que está defendendo fica dentro do gol.
  const defendingTeam=team===0?teamB:teamA;
  const waitingKeeper=(team===0?teamA:teamB)[0];
  pen.keeper=defendingTeam[0];
  const goalX=F.x+F.w-7;
  if(pen.keeper){pen.keeper.x=goalX;pen.keeper.y=cy;pen.keeper.homeX=0.99;pen.keeper.homeY=0.5;}
  // O goleiro que não defende fica próximo, mas fora da boca do gol, aguardando.
  if(waitingKeeper){waitingKeeper.x=goalX-F.w*0.07;waitingKeeper.y=cy+(team===0?-F.h*0.19:F.h*0.19);}
  // Filas organizadas nas laterais opostas: azul acima e laranja abaixo.
  for(let t=0;t<2;t++){
    const arr=(t===0?teamA:teamB).filter(p=>p.role!=='GK');
    const sideY=t===0?F.y+F.h*0.07:F.y+F.h*0.93;
    arr.forEach((q,i)=>{
      if(q===shooter)return;
      q.x=F.x+F.w*(0.14+i*0.105);
      q.y=sideY;
    });
  }
  if(false){
    pen.phase='ai';pen.shotTimer=0.65+Math.random()*0.45;
    // IA escolhe o canto; às vezes mira para fora (erro visível, bola passa ao lado da trave).
    const goalHalf=F.h*0.10;
    if(Math.random()<DIFF().aiMiss) pen.aiAimY=cy+(Math.random()<0.5?-1:1)*goalHalf*(1.2+Math.random()*0.5);
    else pen.aiAimY=cy+(Math.random()*2-1)*goalHalf*0.85;
  }
  showGkPick(team===1);
  const ti=penTensionInfo(); pen.tense=!!ti; pen.tenseT=0; pen.beatT=0.2;
  if(ti)showTension(true,ti.title,ti.sub);else showTension(false);
  renderPenBoard();
}
// Cobrança de pênalti 100% física: o resultado vem de onde a bola realmente cruza a linha do gol
// e de onde o goleiro realmente chega. Nada de sorteio separado da animação.
function penaltyLaunch(v, power, keeperLane){
  const goalLineX=F.x+F.w, cy=F.y+F.h/2, goalHalf=F.h*0.10, depth=Math.min(F.w*0.24,140);
  const bx=ball.x, by=ball.y, keeper=pen.keeper, kx=goalLineX-7;
  let crossY=null, onTarget=false;
  if(v.x>0.1){const t=(goalLineX-bx)/v.x; crossY=by+v.y*t; onTarget=Math.abs(crossY-cy)<=goalHalf-3;}
  const laneY=[cy-goalHalf*0.72,cy,cy+goalHalf*0.72];
  const laneOf=y=>y<cy-goalHalf*0.34?0:(y>cy+goalHalf*0.34?2:1);
  const lane=(keeperLane!=null)?keeperLane:((onTarget&&Math.random()<DIFF().guess*0.35)?laneOf(crossY):Math.floor(Math.random()*3)); // goleiro adivinha bem menos o canto
  const reach=(keeperLane!=null)?goalHalf*0.20:goalHalf*(0.19+Math.max(0,0.6-power)*0.25); // alcance do goleiro; chute fraco é mais fácil de pegar
  let outcome='miss', to, keeperY=laneY[lane];
  if(onTarget) outcome=Math.abs(crossY-laneY[lane])<=reach?'save':'goal';
  if(outcome==='goal'){
    const tx=goalLineX+depth*0.55, f=(tx-bx)/v.x; to={x:tx,y:by+v.y*f};
  }else if(outcome==='save'){
    to={x:kx-(keeper?keeper.r:7.5)-ball.r,y:crossY}; keeperY=crossY;
  }else if(v.x>0.1){

function fieldPlayers(team) {
  return team.filter(p => p.role !== 'GK');
}



function selected() {
  if(foulRestart&&foulRestart.team===0&&foulRestart.player)return foulRestart.player;
  if (penaltyMode && pen) { if(pen.currentTeam!==0 || pen.phase==='ai' || pen.phase==='shot') return null; if(pen.shooter) return pen.shooter; }
  if(selectedPosition==='Goleiro') return teamA.find(p=>p.role==='GK')||null;

  if (list.length === 0) return null;
  const candidates=list.filter(p=>selectedPosition==='Atacante'?p.role==='F':selectedPosition==='Meia'?p.role==='M':selectedPosition==='Volante'?p.role==='M'&&p.homeX<.55:selectedPosition==='Zagueiro'?p.role==='D':selectedPosition==='Lateral'?p.role==='D'&&(p.homeY<.3||p.homeY>.7):true);

function startCharge(type) {
  if (lob) { const sp = selected(); if (sp && dist(sp, ball) < 64 && ball.z < 64) headerBy(sp); return; } // cabeceio por comando
  if (foulRestart) return; // faltas são cobradas automaticamente
  if (!active || halt || (matchOver && !penaltyMode) || charging || goalFreeze > 0) return;
  if (!ball) return;

  let p = selected();
  if (!p) return;

  // Passe de primeira: com a bola chegando de um companheiro, o botão de passe toca direto
  if (type !== 'shot' && firstTouchOn && !penaltyMode) {
    if (ftIncoming(p, 40)) { ftHumanPass(p); return; }
    if (ftIncoming(p, 130)) { p.ftArm = performance.now() + 450; return; }
  }
  // Só inicia passe/chute com a bola praticamente no pé (sem puxar de longe).
  const touchMax = p.r + ball.r + 6;
  if (penaltyMode ? (pen.shooter!==p || dist(p,ball)>100) : (!p || dist(p, ball) > touchMax)) return;

  charging = type;
  chargePower = 0;
  chargeStart = performance.now();
  powerBarWrap.style.display = 'block';
  powerBarFill.style.width = '0%';
  powerBarLabel.textContent = type === 'shot' ? 'CHUTE 0%' : 'PASSE 0%';
  powerBarFill.style.background = type === 'shot'
    ? 'linear-gradient(90deg,#ffe447,#ff9c42,#ff3d3d)'
    : 'linear-gradient(90deg,#4ef4ff,#4bbdff,#3b7fff)';

  ball.vx = 0;
  ball.vy = 0;

function updateCharge() {
  if (!charging) return;
  const elapsed = (performance.now() - chargeStart) / 1000;
  chargePower = clamp(elapsed / CHARGE_TIME, 0, 1);
  const pct = Math.round(chargePower * 100);
  powerBarFill.style.width = pct + '%';
  powerBarLabel.textContent = (charging === 'shot' ? 'CHUTE ' : 'PASSE ') + pct + '%';

  // Enquanto carrega, bola gruda no jogador (só se ainda estiver no alcance)
  const p = selected();
  if (p && ball) {
    if (!penaltyMode && dist(p, ball) > p.r + ball.r + 10) { cancelCharge(); return; }
    const n = getAimDir(p);
    ball.x = p.x + n.x * (p.r + ball.r + 1);
    ball.y = p.y + n.y * (p.r + ball.r + 1);
    ball.vx = 0;
    ball.vy = 0;
  }
}

function cancelCharge() {
  charging = null;
  chargePower = 0;
  if (powerBarWrap) {
    powerBarWrap.style.display = 'none';
    powerBarFill.style.width = '0%';
  }
}

function getAimDir(p) {
  // Pênalti: o gol é sempre o da direita; só a altura (canto) é escolhida por joystick/mouse.
  if (penaltyMode && pen) {
    const gx = F.x + F.w, cyP = F.y + F.h / 2, ghP = F.h * 0.10;
    let ay = cyP;
    if (mouseAimActive && performance.now()-mouseAimTs<1500) ay = clamp(mouseAim.y, cyP - ghP * 1.25, cyP + ghP * 1.25);
    else if (Math.abs(joy.y) > 0.1) ay = cyP + joy.y * ghP * 0.9;
    return norm(gx - p.x, ay - p.y);
  }
  // Cursor do mouse só conta se houve movimento recente (evita mira “fantasma” no celular).
  if (mouseAimActive && performance.now()-mouseAimTs<1500 && (Math.abs(mouseAim.x-p.x)>2 || Math.abs(mouseAim.y-p.y)>2)) {
    return norm(mouseAim.x-p.x, mouseAim.y-p.y);
  }
  // Joystick / teclado só se estiver ativo de verdade
  if (Math.abs(joy.x) > 0.12 || Math.abs(joy.y) > 0.12) {
    return norm(joy.x, joy.y);
  }
  // Sem input: mira pro gol adversário (respeita troca de lado no 2º tempo)
  const goalX = ((p.team === 0) !== sidesSwapped) ? F.x + F.w - 18 : F.x + 18;
  const goalY = F.y + F.h / 2;
  return norm(goalX - p.x, goalY - p.y);
}

function releaseCharge() {
  if (!charging) return;
  const type = charging;
  const power = Math.max(chargePower, 0.25);
  cancelCharge();
  if (!ball) return;

  let p = selected();
  if (!p) return;

  // Só conclui se a bola ainda estiver no pé.
  if (!p || dist(p, ball) > p.r + ball.r + 8) return;

  const v = getAimDir(p);
  if(penaltyMode && pen && type==='shot' && pen.currentTeam===0){
    let vv=v;
    if(power>0.92){const a=(Math.random()-0.5)*0.1,c=Math.cos(a),n=Math.sin(a);vv={x:v.x*c-v.y*n,y:v.x*n+v.y*c};}
    penaltyLaunch(vv,power);
    return;
  }
  if (type === 'shot') {
    shots[p.team]++;
    // Curva mais suave: 30% fica moderado, 100% é forte
    // power 0.25..1.0 -> usa ease (power^1.35)
    const pCurve = Math.pow(power, 1.35);
    const speed = 2.8 + 9.5 * pCurve; // ~3.5 em 30%, ~12.3 em 100%
    ball.vx = v.x * speed;
    ball.vy = v.y * speed;
  } else {
    const pCurve = Math.pow(power, 1.2);
    const speed = 2.6 + 6.2 * pCurve;
    // Passe manual segue diretamente a direção escolhida pelo cursor/joystick.
    ball.vx = v.x * speed;
    ball.vy = v.y * speed;
  }

  // Empurra bem longe do pé para o drible não "comer" o chute
  ball.x = p.x + v.x * (p.r + ball.r + 14);
  ball.y = p.y + v.y * (p.r + ball.r + 14);
  p.cool = 0.7;
  touch(p);
  kickLock = 0.45; // impede pegar a bola de novo logo após o chute/passe
  if(foulRestart){foulRestart=null;foulCooldown=6;foulBanner=null;}

function nearestToBall(arr) {
  const list = arr.filter(p => p.role !== 'GK');
  if (!list.length) return null;
  return list.reduce((best, p) => dist(p, ball) < dist(best, ball) ? p : best, list[0]);
}

function closestToBall(arr, n) {
  const list = arr.filter(p => p.role !== 'GK').slice();
  list.sort((a, b) => dist(a, ball) - dist(b, ball));
  return list.slice(0, n);
}

function whoHasBall() {
  for (const p of all) {
    if (p.role === 'GK') continue;
    if (dist(p, ball) < p.r + ball.r + 8) return p.team;
  }
  if (Math.hypot(ball.vx, ball.vy) < 1.5) {
    let closest = null, bestD = 999;
    for (const p of all) {
      if (p.role === 'GK') continue;
      const dd = dist(p, ball);
      if (dd < bestD) { bestD = dd; closest = p; }
    }
    if (closest && bestD < 22) return closest.team;
  }
  return -1;
}

function separatePlayers() {
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      const d = dist(a, b);
      const minD = a.r + b.r + 2;
      if (d < minD && d > 0.1) {
        const push = (minD - d) * 0.4;
        const v = norm(a.x - b.x, a.y - b.y);
        a.x += v.x * push;
        a.y += v.y * push;
        b.x -= v.x * push;
        b.y -= v.y * push;
      }
    }
  }
}

// Estratégia da IA conforme placar e tempo: att = urgência de ataque (perdendo), def = proteger vantagem (ganhando).
// O efeito cresce com o passar do jogo e com o tamanho da diferença no placar.
function aiStrategy(team){
  if(training||penaltyMode||!score)return {att:0,def:0};
  const diff=score[team]-score[1-team];
  const tp=clamp(secs/matchDuration,0,1);
  const w=0.3+0.7*tp;
  if(diff<0)return {att:Math.min(1,0.6+0.2*(-diff-1))*w,def:0};
  if(diff>0)return {att:0,def:Math.min(1,0.6+0.2*(diff-1))*w};

}
let chaserLock=[null,null];

  const covers = [coverOf(teamA, chasersA[0]), coverOf(teamB, chasersB[0])];

// Posição de retorno: origem do jogador, mas sempre atrás do meio de campo (no próprio lado)
function restartTarget(p) {
  const cx = F.x + F.w / 2, cy = F.y + F.h / 2;
  const ownLeft = ((p.team === 0) !== sidesSwapped);
  let tx = F.x + p.homeX * F.w, ty = F.y + p.homeY * F.h;
  tx = ownLeft ? Math.min(tx, cx - 10) : Math.max(tx, cx + 10);
  if (p.team !== kickoffTeam) { // quem não dá o pontapé inicial fica fora do círculo central
    const circleR = Math.min(F.h * 0.13, F.w * 0.12) + 6;
    let dx = tx - cx, dy = ty - cy, d = Math.hypot(dx, dy);
    if (d < circleR) {
      if (d < 0.001) { dx = ownLeft ? -1 : 1; dy = 0; d = 1; }
      tx = cx + dx / d * circleR; ty = cy + dy / d * circleR;
    }
  }
  return { x: tx, y: ty };
}

// Todos caminham de volta para a posição de origem, chegando justo quando a pausa termina
function walkBack(dt, timeLeft) {
  for (const p of all) {
    const t = restartTarget(p);
    const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
    p.vx = 0; p.vy = 0; p.dash = 0;
    tickStamina(p, dt, d < 0.5 ? 0 : 3);
    if (d < 0.5) { p.x = t.x; p.y = t.y; continue; }
    const speed = Math.max(75, d / Math.max(timeLeft - 0.4, 0.2));
    const step = Math.min(d, speed * dt);
    p.x += dx / d * step; p.y += dy / d * step;
  }
}

function snapToRestart() {
  for (const p of all) { const t = restartTarget(p); p.x = t.x; p.y = t.y; p.vx = 0; p.vy = 0; p.dash = 0; }
}

function enforceKickoffPositions() {
  if (!kickoffLock) return;
  const cx = F.x + F.w / 2;
  const cy = F.y + F.h / 2;
  const circleR = Math.min(F.h * 0.13, F.w * 0.12) + 6;

  for (const p of all) {
    // Time que NÃO reinicia não cruza o meio nem entra no círculo
    // kickoffTeam = quem tem a bola / reinicia
    if (p.team !== kickoffTeam) {
      // Azul (0) ataca pra direita: não-kickoff se kickoffTeam===0 significa teamB fica na direita
      if (((p.team === 0) !== sidesSwapped)) {
        if (p.x > cx - 4) p.x = cx - 4;
      } else {
        if (p.x < cx + 4) p.x = cx + 4;
      }
    }
    // Ninguém do time sem posse entra no círculo; o time com posse também não satura o círculo (exceto se for o cobrador perto da bola)
    const dC = Math.hypot(p.x - cx, p.y - cy);
    if (dC < circleR) {
      if (p.team !== kickoffTeam || p.role === 'GK') {
        const v = norm(p.x - cx, p.y - cy);
        p.x = cx + v.x * circleR;
        p.y = cy + v.y * circleR;
      }
    }
  }

    }
  }

  const mm = Math.floor(total);
  const ss = Math.floor((total % 1) * 60);
  const el = document.getElementById('clock');
  let pre = '', m2 = mm;
  if (!training) {
    if (!halftimeDone || halftimePause > 0 || halftimeWait) { if (mm >= matchDuration / 2) { pre = (matchDuration / 2) + '+'; m2 = mm - matchDuration / 2; } }
    else if (mm >= matchDuration) { pre = matchDuration + '+'; m2 = mm - matchDuration; }
  }
  if (el) { const tx = pre + (pre ? String(m2) : String(mm).padStart(2, '0')) + ':' + String(ss).padStart(2, '0'); if (el._t !== tx) { el._t = tx; el.textContent = tx; } }
}

function update(dt) {
  stepRain(dt); // anima gotas de chuva mesmo durante intro/pausa de gol
  { const myCorner=!!(foulRestart&&foulRestart.corner&&foulRestart.team===0);
    const cb=document.getElementById('crossBtn'); if(cb){cb.style.display=myCorner?'':'none';cb.classList.toggle('pulse',myCorner);}
    document.body.classList.toggle('celeb',goalCelebT>0&&goalFreeze>0); }
  if (intro && ball) { updateIntro(dt); return; }
  if (!ball) return;
  if (replayButtonTimer>0 && !replayPlayback) { replayButtonTimer=Math.max(0,replayButtonTimer-dt); if(replayButtonTimer<=0){const rb=document.getElementById("replayBtn");if(rb)rb.style.display="none";} }

  // Após um gol, o relógio da partida fica completamente congelado durante
  // os 5 segundos de reposicionamento/reinício. Só volta a contar ao retomar.
  if (goalFreeze > 0 && goalCelebT > 0) {
    goalCelebT -= dt;
    for (const q of all) { q.vx = 0; q.vy = 0; q.dash = 0; if (q !== celebP) tickStamina(q, dt, 0); }
    if (celebP && celebTarget) {
      const dx = celebTarget.x - celebP.x, dy = celebTarget.y - celebP.y, d = Math.hypot(dx, dy);
      if (d > 1) { const step = Math.min(d, 150 * dt); celebP.x += dx / d * step; celebP.y += dy / d * step; }
      else { celebP.x = celebTarget.x; celebP.y = celebTarget.y; }
    }
    for (const m of celebMates) {
      const dx = m.x - m.q.x, dy = m.y - m.q.y, d = Math.hypot(dx, dy);
      if (d > 1) { const step = Math.min(d, Math.max(150, d / 2.4) * dt); m.q.x += dx / d * step; m.q.y += dy / d * step; }
    }
    if (goalCelebT <= 0) { goalCelebT = 0; celebP = null; celebTarget = null; celebMates = []; }
    updateClockDisplay();
    return;
  }
  if (goalFreeze > 0) {
    walkBack(dt, goalFreeze);
    goalFreeze -= dt;
    if (goalFreeze <= 0) { goalFreeze = 0; goalCelebT = 0; snapToRestart(); }
    updateClockDisplay();
    return;
  }

  if (!active || halt || (matchOver && !penaltyMode)) return;
  if(halftimeWait){if(halftimePause>0){walkBack(dt,halftimePause);halftimePause-=dt;if(halftimePause<=0){halftimePause=0;snapToRestart();}}return;}
  if(!training&&!halftimeDone&&stopAnn[0]&&secs>=matchDuration/2+stoppageHalf[0]){secs=matchDuration/2+stoppageHalf[0];if(stoppageHolding()){stoppageHoldT+=dt;}else{stoppageHoldT=0;stoppageBanner=null;halftimeDone=true;halftimePause=5;halftimeWait=true;aiSubs();showHalfBox(true);whistle('half');sidesSwapped=true;kickoffTeam=1-kickoffTeam;for(const p of all){p.homeX=1-p.homeX;}cancelCharge();ball.vx=ball.vy=0;ball.z=0;lob=null;ball.x=F.x+F.w/2;ball.y=F.y+F.h/2;goalFreeze=0;goalCelebT=0;return;}}
  if(penaltyMode && pen){
    tensionTick(dt);
    if(pen.phase==='ai'){
      pen.shotTimer-=dt;
      if(pen.shotTimer<=0){
        penaltyLaunch(norm(F.x+F.w-ball.x,pen.aiAimY-ball.y),0.8,pen.userLane);
      }
      return;
    }
    updateCharge();
    if(pen.phase==='shot'){
      pen.shotTimer-=dt;
      const a=pen.anim;
      if(a){a.t+=dt;const u=Math.min(1,a.t/a.dur);ball.x=a.fx+(a.tx-a.fx)*u;ball.y=a.fy+(a.ty-a.fy)*u;ball.vx=ball.vy=0;
        if(pen.keeper){const k=Math.min(1,a.t/a.kdur);pen.keeper.y=a.ky0+(a.ky1-a.ky0)*k;}}
      if(pen.shotTimer<=0){penaltyShot(pen.currentTeam,pen.shotResult);}
    }
    return;
  }
  updateCharge();
  if (kickLock > 0) kickLock -= dt;
  if(foulCooldown>0)foulCooldown-=dt;
  if (!training) { const w = whoHasBall(); if (w >= 0) poss[w] += dt; }

  // Relógio restaurado à velocidade anterior
  secs += dt * matchClockSpeed;
  if (!training) {
    if (!halftimeDone && !stopAnn[0] && secs >= matchDuration / 2) announceStoppage(0);
    else if (halftimeDone && !stopAnn[1] && secs >= matchDuration) announceStoppage(1);
  }
  if (!training && stopAnn[1] && secs >= matchDuration+stoppageHalf[1]) {
    secs = matchDuration+stoppageHalf[1];
    if (stoppageHolding()) { stoppageHoldT += dt; }
    else { stoppageHoldT = 0; stoppageBanner = null; updateClockDisplay(); endMatch(); return; }
  }
  updateClockDisplay();
  // Grava uma janela recente da jogada para replay (snapshot a cada ~0,12s).
  replayRecordTick += dt;
  if(replayRecordTick >= 0.12 && !training && !penaltyMode){
    replayRecordTick=0;
    replayFrames.push({b:{x:ball.x,y:ball.y},p:all.map(q=>({x:q.x,y:q.y}))});
    if(replayFrames.length>100) replayFrames.shift();
  }

  const p = selected();
  if (p && !foulRestart) {
    // Fôlego: correr gasta, andar/parar recupera; cansado fica mais lento
    const moving = Math.hypot(joy.x, joy.y) > 0.1;
    if (p.stamina === undefined) p.stamina = 100;
    const canSprint = sprinting && moving && !p.exhausted && p.stamina > 0;
    tickStamina(p, dt, !moving ? 0 : (canSprint ? 2 : (Math.hypot(joy.x, joy.y) < 0.5 ? 3 : 1)));
    const tired = staminaFactor(p);
    const spd = (canSprint ? 2.4 : 1.55 * tired) * dt * 60;
    p.x += joy.x * spd;
    p.y += joy.y * spd;
    p.x = clamp(p.x, F.x + 4, F.x + F.w - 4);
    p.y = clamp(p.y, F.y + 4, F.y + F.h - 4);

    // Só dribla se não acabou de chutar/passar e a bola está lenta
    const ballSpd = Math.hypot(ball.vx, ball.vy);
    if (!charging && kickLock <= 0 && ballSpd < 3.5 && dist(p, ball) < p.r + ball.r + 14) {
      const push = 8.2;
      ball.x = p.x + joy.x * push;
      ball.y = p.y + joy.y * push;
      ball.vx *= 0.28;
      ball.vy *= 0.28;
    }
  }

  if(foulRestart){enforceFoulRestart(dt); updateCharge(); if(foulRestart&&foulRestart.corner){const cr=foulRestart; if((cr.team===1&&cr.elapsed>2.2)||(cr.team===0&&(cr.cross||cr.elapsed>8)))launchCross(cr.player,true); return;} if(foulRestart&&foulRestart.elapsed>1.8)aiFoulKick();
  if(foulRestart&&foulRestart.elapsed>4){foulRestart=null;foulCooldown=6;foulBanner=null;} return;}
  ai(dt);
  enforceKickoffPositions();
  foulCheck(dt);
  if(foulRestart){enforceFoulRestart(dt);return;}
  if(lob){stepLob(dt);return;}

  ball.x += ball.vx * dt * 60;
  ball.y += ball.vy * dt * 60;
  for(const q of all){if(dist(q,ball)<q.r+ball.r+6)touch(q);}
  ball.vx *= 0.985;
  ball.vy *= 0.985;

  // Libera o engajamento quando a bola sai do círculo central ou ganha velocidade
  if (kickoffLock) {
    const cx = F.x + F.w / 2, cy = F.y + F.h / 2;
    const circleR = Math.min(F.h * 0.13, F.w * 0.12);
    if (Math.hypot(ball.x - cx, ball.y - cy) > circleR + 8 || Math.hypot(ball.vx, ball.vy) > 2.5) {
      kickoffLock = false;
    }
  }

  for (const q of all) {
    // Não colide com o jogador que acabou de chutar/passar
    if (kickLock > 0 && q === selected()) continue;
    const d = dist(q, ball);
    const minD = q.r + ball.r;
    if (d < minD && d > 0.01) {
      const v = norm(ball.x - q.x, ball.y - q.y);
      ball.x = q.x + v.x * (minD + 0.4);
      ball.y = q.y + v.y * (minD + 0.4);
      // Recepção mais limpa: reduz o ricochete e absorve parte da velocidade
      // da bola, evitando que passes simples escapem após o primeiro toque.
      const incomingSpeed = Math.hypot(ball.vx, ball.vy);
      const absorb = q.role === 'GK' ? 0.78 : 0.66;
      ball.vx = ball.vx * (1 - absorb) + v.x * Math.min(1.0, incomingSpeed * 0.12);
      ball.vy = ball.vy * (1 - absorb) + v.y * Math.min(1.0, incomingSpeed * 0.12);
      // Mantém a bola próxima do recebedor para facilitar o domínio.
      if (incomingSpeed < 9) { ball.vx *= 0.72; ball.vy *= 0.72; }
    }
  }

  if (ball.y < F.y + ball.r) {
    ball.y = F.y + ball.r;
    ball.vy *= -0.62;
  } else if (ball.y > F.y + F.h - ball.r) {
    ball.y = F.y + F.h - ball.r;
    ball.vy *= -0.62;
  }

  const goalHeight=F.h*0.20, goalCenterY=F.y+F.h/2, inGoalY=Math.abs(ball.y-goalCenterY)<goalHeight/2-ball.r*0.35;
  // Rebate nas traves (limites superior/inferior da abertura)
  if(Math.abs(ball.x-F.x)<10 || Math.abs(ball.x-(F.x+F.w))<10){
    const postTop=goalCenterY-goalHeight/2, postBottom=goalCenterY+goalHeight/2;
    if(Math.abs(ball.y-postTop)<ball.r+2 || Math.abs(ball.y-postBottom)<ball.r+2){ball.vx*=-0.75;ball.vy*=-0.75;}
  }
  if(ball.x<F.x-ball.r){if(inGoalY){onGoal(sidesSwapped?0:1);}else if(!tryCorner(true)){ball.x=F.x+ball.r+1;ball.vx*=-0.65;}}
  else if(ball.x>F.x+F.w+ball.r){if(inGoalY){onGoal(sidesSwapped?1:0);}else if(!tryCorner(false)){ball.x=F.x+F.w-ball.r-1;ball.vx*=-0.65;}}
}

function updateIntro(dt){
  intro.t+=dt;
  const t=intro.t;
  for(const arr of [teamA,teamB]){
    const n=arr.length;
    arr.forEach((p,i)=>{
      const rt=restartTarget(p), hx=rt.x, hy=rt.y;
      const sx=F.x+F.w*(p.team?0.56:0.44)+(i-n/2)*4, sy=F.y+F.h+45;
      const t0=i*0.13+(p.team?0.07:0);
      const u=clamp((t-t0)/2.0,0,1), e=u*(2-u);
      p.x=sx+(hx-sx)*e; p.y=sy+(hy-sy)*e+(u<1?Math.sin(t*16+i)*0.8:0);
      p.vx=p.vy=0;
    });
  }
  ball.x=F.x+F.w/2; ball.y=F.y+F.h/2; ball.vx=ball.vy=0;

function drawIntroCard(team,lt,len){

function playGoalReplay(){ if(replayPlayback){stopGoalReplay();return;} if(replayFrames.length<2)return; replaySaved={b:{x:ball.x,y:ball.y},p:all.map(q=>({x:q.x,y:q.y}))}; halt=true;active=false; replayPlayback={frames:replayFrames.slice(),i:0,tick:0}; const b=document.getElementById("replayBtn");if(b)b.textContent="⏹ Parar"; }
function stopGoalReplay(){ if(!replayPlayback)return; replayPlayback=null; if(replaySaved&&ball){ball.x=replaySaved.b.x;ball.y=replaySaved.b.y;all.forEach((q,j)=>{if(replaySaved.p[j]){q.x=replaySaved.p[j].x;q.y=replaySaved.p[j].y;}});} replaySaved=null; active=true;halt=false;const b=document.getElementById("replayBtn");if(b){b.textContent="▶ Replay";} }
function draw() {
  if (!cw || !ch) return;

  g.clearRect(0, 0, cw, ch);

  const stD = curStadium;
  const wVis = Object.assign({}, WEATHER_INFO[weather] || WEATHER_INFO.sol, {bg: stD.outer, line: stD.line});
  g.fillStyle = wVis.bg;
  g.fillRect(0, 0, cw, ch);

  // Câmera: segue a bola (ou o gol nos pênaltis), sem deixar o jogador controlado sair da tela
  {
    const topSpace = 36, bottomSpace = 96, viewH = ch - topSpace - bottomSpace;
    let tx, ty;
    if (penaltyMode && pen) { tx = F.x + F.w * 0.86; ty = F.y + F.h / 2; }
    else if (goalCelebT > 0 && goalFreeze > 0 && celebP) { tx = celebP.x; ty = celebP.y; }
    else if (ball) {
      tx = ball.x; ty = ball.y;
      const sp = selected();
      if (sp) {
        const mx = cw / 2 - 40, my = viewH / 2 - 30;
        tx = clamp(tx, sp.x - mx, sp.x + mx); ty = clamp(ty, sp.y - my, sp.y + my);
      }
    } else { tx = F.x + F.w / 2; ty = F.y + F.h / 2; }
    const bigX = F.w + 16 > cw + 20, bigY = F.h > viewH + 8;
    const loX = bigX ? -STAD_MX : 0, loY = bigY ? -STAD_MYT : 0;
    const wantX = clamp(tx - cw / 2, loX, Math.max(loX, F.w + 16 + (bigX ? STAD_MX : 0) - cw));
    const wantY = clamp(ty - (topSpace + viewH / 2), loY, Math.max(loY, F.h - viewH));
    if (!camReady || Math.hypot(wantX - camX, wantY - camY) > 400) { camX = wantX; camY = wantY; camReady = true; }
    else { camX += (wantX - camX) * 0.18; camY += (wantY - camY) * 0.18; }
  }
  g.save();
  if(intro){introTransform();}else g.translate(-Math.round(camX), -Math.round(camY));

  // Estádio: arquibancadas, torcida, placas, luzes e gramado
  const stT = performance.now() / 1000;
  const stExc = (goalFreeze > 0 || (goalBanner && goalBanner.time > 0)) ? 1 : 0;
  if (stExc && !stadExcPrev) stadBurstT = stT;
  stadExcPrev = stExc;
  const stV = stadView(g, stT, stExc);
  const stC = (!stExc && stD.id!=='neon') ? stadCacheGet(stD) : null;
  if (stC) g.drawImage(stC.cv, stC.x, stC.y, stC.w, stC.h); else stadBack(g, F, stV, stD, stT);
  if (!stC) stadGrass(g, F, stV, stD, stT);

  }

  g.strokeStyle = wVis.line;
  g.lineWidth = 1.5;
  g.strokeRect(F.x, F.y, F.w, F.h);

  g.beginPath();
  g.moveTo(F.x + F.w / 2, F.y);
  g.lineTo(F.x + F.w / 2, F.y + F.h);
  g.stroke();

  g.beginPath();
  g.arc(F.x + F.w / 2, F.y + F.h / 2, Math.min(F.h * 0.13, F.w * 0.12), 0, Math.PI * 2);
  g.stroke();

  // Áreas de pênalti, pequenas áreas e marcas, inspiradas no campo da referência.
  const boxW=F.w*0.22, boxH=F.h*0.42, sixW=F.w*0.09, sixH=F.h*0.22;
  for(const side of [0,1]){
    const bx=side===0?F.x:F.x+F.w-boxW, sy=F.y+(F.h-boxH)/2;

    else{g.save();const bw=Math.min(cw*.88,360),bh=64,bx=(cw-bw)/2,by=Math.max(48,ch*.12)+(stoppageBanner?46:0);g.fillStyle='rgba(12,24,38,.92)';g.fillRect(bx,by,bw,bh);g.strokeStyle=subBanner.team?'#ff9c4b':'#4bbdff';g.lineWidth=3;g.strokeRect(bx,by,bw,bh);g.textAlign='center';g.fillStyle='#ffd66b';g.font='bold 13px Arial';g.fillText('🔁 SUBSTITUIÇÃO · '+(subBanner.team?teamOrangeName:teamBlueName),cw/2,by+22);g.font='bold 13px Arial';g.fillStyle='#ff9c9c';g.fillText('⬇ Sai: '+subBanner.out,cw/2,by+40);g.fillStyle='#7dffb0';g.fillText('⬆ Entra: '+subBanner.inn,cw/2,by+56);g.restore();}

  }
  // A pausa após o gol é controlada pela faixa discreta; sem overlay duplicado.

  // Traçado de mira (passe/chute)
  if (charging && ball) {
