  // Minimap translucido no canto superior esquerdo (longe dos botões), abaixo do placar em telas estreitas.

    const bx=mx+(ball.x-F.x)/F.w*mw,by=my+(ball.y-F.y)/F.h*mh;g.beginPath();g.arc(bx,by,Math.max(2.6,mh*.045),0,Math.PI*2);g.fillStyle='#fff';g.fill();
    g.restore();
  }

  if(replayPlayback && ball){
    replayPlayback.tick++;
    if(replayPlayback.tick>=8){replayPlayback.tick=0; replayPlayback.i++;}

    else {const fr=replayPlayback.frames[replayPlayback.i];ball.x=fr.b.x;ball.y=fr.b.y;all.forEach((q,j)=>{if(fr.p[j]){q.x=fr.p[j].x;q.y=fr.p[j].y;}});}
  }
  requestAnimationFrame(draw);
}

}

// Analógico também pode ser controlado no PC pelo teclado (WASD ou setas).
const keysDown = new Set();
addEventListener('keydown', e => {
  if(e.target&&(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable))return; const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keysDown.add(k); e.preventDefault();}
});
addEventListener('keyup', e => keysDown.delete(e.key.toLowerCase()));
// PC: cursor direciona a mira; botão esquerdo carrega passe e direito carrega chute.
// Ignora mousemove sintético de toque (celular) — senão a mira fica presa no lado errado.
let mouseAimTs=0;
cv.addEventListener('mousemove', e => {
  if(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents) return;
  if(e.pointerType==='touch') return;
  const r=cv.getBoundingClientRect();
  mouseAim={x:(e.clientX-r.left)*(cw/r.width)+camX,y:(e.clientY-r.top)*(ch/r.height)+camY};
  mouseAimActive=true; mouseAimTs=performance.now();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  if(e.pointerType==='touch') return;
  if(e.button!==0 && e.button!==2) return; e.preventDefault();
  const type=e.button===2?'shot':'pass'; mouseAction=type; startCharge(type);
});
addEventListener('mouseup', e => { if(mouseAction && ((mouseAction==='shot'&&e.button===2)||(mouseAction==='pass'&&e.button===0))){mouseAction=null;releaseCharge();} });
cv.addEventListener('mouseleave',()=>{mouseAimActive=false;});

// PC: manter J para passe ou K para chute e soltar para executar (barra de força igual ao celular).
const actionKeys = new Set();
addEventListener('keydown', e => { if(e.target&&(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable))return; const k=e.key.toLowerCase(); if((k==='j'||k==='k')&&!e.repeat){e.preventDefault();actionKeys.add(k);startCharge(k==='j'?'pass':'shot');} });
addEventListener('keyup', e => { const k=e.key.toLowerCase(); if(actionKeys.has(k)){actionKeys.delete(k);releaseCharge();} });
addEventListener('keydown', e => { if(e.target&&(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)))return; if(e.key.toLowerCase()==='l'&&!e.repeat)requestShot(); if(e.key.toLowerCase()==='u'&&!e.repeat)requestCross(); });
addEventListener('blur', () => { keysDown.clear(); actionKeys.clear(); mouseAction=null; joy={x:0,y:0}; mouseAimActive=false; if(charging) cancelCharge(); });
function keyboardJoy(){
  // Joystick de toque tem prioridade; não sobrescreve enquanto o dedo está no analógico.
  if (jo) return;
  let x=(keysDown.has('d')||keysDown.has('arrowright')?1:0)-(keysDown.has('a')||keysDown.has('arrowleft')?1:0);
  let y=(keysDown.has('s')||keysDown.has('arrowdown')?1:0)-(keysDown.has('w')||keysDown.has('arrowup')?1:0);
  if(x||y){const m=Math.hypot(x,y)||1; joy={x:x/m,y:y/m};}
  else {
    // Antes o joy não zerava ao soltar as teclas → passe/chute ia sempre pro último lado.
    joy={x:0,y:0};
  }
}

  };

function uiHudScale(){const h=document.getElementById('hud');const hw=(h&&h.offsetWidth)||230;const W=innerWidth;const room=W<600?W-2*(42*uiCfg.ui+20):W*0.96;return Math.min(uiCfg.hud,Math.max(.7,room/hw));}
function uiPlaceDeps(){

}
function uiApply(){
  const W=innerWidth,H=innerHeight,ui=uiCfg.ui,d=uiDefaults(),w=Math.min(48,W*.125)*ui,smH=28*ui;
  const P=id=>{const q=uiCfg.pos[id];return q?{x:q.x*W,y:q.y*H}:d[id];};
  const E=id=>document.getElementById(id);
  const fix=(el,p,tr)=>{if(!el)return;const st=el.style;st.position='fixed';st.left=p.x+'px';st.top=p.y+'px';st.right='auto';st.bottom='auto';st.margin='0';st.transform=tr;};
  ['passBtn','shotBtn','runBtn'].forEach(id=>{const el=E(id);fix(el,P(id),'translate(-50%,-50%)');el.style.width=el.style.height=w+'px';el.style.fontSize=(10*ui)+'px';});
  ['requestPassBtn','requestShotBtn'].forEach(id=>{const el=E(id);fix(el,P(id),'translate(-50%,-50%)');el.style.width=w+'px';el.style.height=smH+'px';el.style.fontSize=(8*ui)+'px';});
  {const el=E('crossBtn');fix(el,P('crossBtn'),'translate(-50%,-50%)');el.style.width=(3*w+8)+'px';el.style.height=smH+'px';el.style.fontSize=(9*ui)+'px';}
  fix(E('joy'),P('joy'),'translate(-50%,-50%) scale('+ui+')');
  {const el=E('pause');fix(el,P('pause'),'translate(-50%,-50%)');el.style.width=(42*ui)+'px';el.style.height=(38*ui)+'px';el.style.fontSize=(18*ui)+'px';el.style.padding='0';}
  {const el=E('hud');const p=P('hud');el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transformOrigin='top center';}
  fix(E('powerBarWrap'),P('powerBarWrap'),'translate(-50%,-50%) scale('+ui+')');
  {const el=E('pcHint');if(el){const st=el.style;st.position='fixed';st.left='50%';st.bottom='2px';st.transform='translateX(-50%)';}}
  uiPlaceDeps();
}
function uiTick(){if(!uiEditing)uiPlaceDeps();}
function uiCur(id){const W=innerWidth,H=innerHeight,q=uiCfg.pos[id];return q?{x:q.x*W,y:q.y*H}:uiDefaults()[id];}
function openLayoutEditor(){
  uiSnap=JSON.parse(JSON.stringify(uiCfg));uiEditing=true;
  const hud=document.getElementById('hud');
  if(!active){hud.innerHTML='<div class="scoreboard"><div class="sb-team"><span class="sb-dot" style="background:#3aa0ff;color:#3aa0ff"></span><span class="name">SEU TIME</span></div><div class="sb-score">0 - 0</div><div class="sb-team"><span class="sb-dot" style="background:#ff9a3a;color:#ff9a3a"></span><span class="name">ADVERSÁRIO</span></div></div><div class="sb-clock">00:00</div>';}
  document.body.classList.add('ui-edit');
  const ed=document.getElementById('layoutEd');ed.style.display='block';document.body.classList.toggle('ui-solid',!active);
  document.getElementById('ledUi').value=uiCfg.ui;document.getElementById('ledHud').value=uiCfg.hud;
  uiApply();
}
function uiClose(){
  uiEditing=false;uiDrag=null;
  document.body.classList.remove('ui-edit','ui-solid');document.getElementById('layoutEd').style.display='none';
  if(!active)document.getElementById('hud').innerHTML='';
  uiApply();
  document.getElementById('menu').style.display='flex';
  if(active&&halt)pausePanel();else configMenu();
}
function uiSetSize(){uiCfg.ui=+document.getElementById('ledUi').value;uiCfg.hud=+document.getElementById('ledHud').value;uiApply();}
function uiReset(){uiCfg={ui:1.35,hud:1.4,pos:{}};document.getElementById('ledUi').value=uiCfg.ui;document.getElementById('ledHud').value=uiCfg.hud;uiApply();}
function uiCancel(){uiCfg=uiSnap||uiCfg;uiClose();}
function uiDone(){uiPersist();uiClose();}
// Durante a edição, os toques nos itens só arrastam (não acionam o jogo)
['pointerdown','pointermove','pointerup','pointercancel','click'].forEach(ev=>addEventListener(ev,e=>{
  if(!uiEditing)return;
  const it=e.target&&e.target.closest?e.target.closest(UI_SEL):null;
  if(ev==='pointerdown'&&it){
    e.preventDefault();e.stopImmediatePropagation();
    const c=uiCur(it.id);uiDrag={id:it.id,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,pid:e.pointerId};
    try{it.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  if(uiDrag&&(ev==='pointermove')){
    e.preventDefault();e.stopImmediatePropagation();
    const W=innerWidth,H=innerHeight;
    const nx=Math.max(0,Math.min(W,uiDrag.ox+e.clientX-uiDrag.sx)),ny=Math.max(0,Math.min(H,uiDrag.oy+e.clientY-uiDrag.sy));
    uiCfg.pos[uiDrag.id]={x:nx/W,y:ny/H};uiApply();return;
  }
  if(uiDrag&&(ev==='pointerup'||ev==='pointercancel')){e.stopImmediatePropagation();uiDrag=null;return;}
  if(it||ev==='click'&&it){e.stopImmediatePropagation();e.preventDefault();}
},true));
// A barra de ferramentas também pode ser arrastada pelo título, para não ficar em cima de um botão
(function(){const box=document.querySelector('#layoutEd .ledBox'),hd=box&&box.querySelector('b');if(!hd)return;hd.style.cursor='grab';hd.style.touchAction='none';let d=null;
  hd.addEventListener('pointerdown',e=>{const r=box.getBoundingClientRect();d={dx:e.clientX-(r.left+r.width/2),dy:e.clientY-(r.top+r.height/2)};try{hd.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  hd.addEventListener('pointermove',e=>{if(!d)return;box.style.left=Math.max(60,Math.min(innerWidth-60,e.clientX-d.dx))+'px';box.style.top=Math.max(40,Math.min(innerHeight-40,e.clientY-d.dy))+'px';});
  hd.addEventListener('pointerup',()=>{d=null;});hd.addEventListener('pointercancel',()=>{d=null;});
})();
uiLoad();uiApply();addEventListener('resize',uiApply);setInterval(uiTick,400);

const je = document.getElementById('joy');
const kn = document.getElementById('knob');
let jo = false;

function resetKnob() {
  joy = {x: 0, y: 0};
  kn.style.left = '21px';
  kn.style.top = '21px';
}

function jm(e) {
  const r = je.getBoundingClientRect();
  let x = e.clientX - r.left - r.width / 2;
  let y = e.clientY - r.top - r.height / 2;
  const l = Math.hypot(x, y);
  const sc = r.width / 72;
  const max = 21 * sc;
  const m = Math.min(l, max);
  const nx = (l > 0.001) ? x / l : 0;
  const ny = (l > 0.001) ? y / l : 0;
  joy = {x: nx * (m / max), y: ny * (m / max)};
  kn.style.left = (21 + joy.x * 21) + 'px';
  kn.style.top = (21 + joy.y * 21) + 'px';
}

je.addEventListener('pointerdown', e => {
  e.preventDefault();
  jo = true;
  try { je.setPointerCapture(e.pointerId); } catch (_) {}
  jm(e);
}, {passive: false});

je.addEventListener('pointermove', e => {
  if (!jo) return;
  e.preventDefault();
  jm(e);
}, {passive: false});

je.addEventListener('pointerup', () => { jo = false; resetKnob(); });
je.addEventListener('pointercancel', () => { jo = false; resetKnob(); });
je.addEventListener('pointerleave', () => { if (jo) { jo = false; resetKnob(); } });

const rb = document.getElementById('runBtn');
rb.addEventListener('pointerdown', e => { e.preventDefault(); sprinting = true; }, {passive: false});
rb.addEventListener('pointerup', () => { sprinting = false; });
rb.addEventListener('pointerleave', () => { sprinting = false; });
rb.addEventListener('pointercancel', () => { sprinting = false; });

function bindChargeButton(btn, type) {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    startCharge(type);
  }, {passive: false});
  btn.addEventListener('pointerup', e => {
    e.preventDefault();
    e.stopPropagation();
    releaseCharge();
  }, {passive: false});
  btn.addEventListener('pointercancel', e => {
    releaseCharge();
  });
  // Não usa pointerleave para não cancelar com deslize leve
}
bindChargeButton(document.getElementById('passBtn'), 'pass');
bindChargeButton(document.getElementById('shotBtn'), 'shot');

document.addEventListener('contextmenu', e => e.preventDefault());
menu();
</script>
